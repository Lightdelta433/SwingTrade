# Pulse backtest lab — läuft NUR auf dem Branch "backtest-lab" (main / die Live-App bleibt unberührt).
# Holt Tagesdaten (Yahoo, Ersatz Stooq), verschlüsselt sie mit lab/pubkey.pem und legt sie in lab/data ab.
name: backtest-lab

on:
  push:
    branches: [backtest-lab]
    paths:
      - "lab/fetch_data.py"
      - "lab/request.txt"
      - ".github/workflows/backtest-lab.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: backtest-lab
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: backtest-lab

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install "yfinance>=0.2.54" pandas numpy

      - name: Fetch daily data
        run: python lab/fetch_data.py

      - name: Encrypt (only the holder of the private key can read it)
        run: |
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in lab/out/market.csv.gz -out lab/data/market.enc -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey lab/pubkey.pem -pkeyopt rsa_padding_mode:oaep -in k.txt -out lab/data/market.key
          rm -f k.txt
          rm -rf lab/out
          ls -la lab/data

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lab/data
          git commit -m "lab: daily data snapshot (encrypted)" || echo "nothing to commit"
          git push origin HEAD:backtest-lab
