<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="pulse-ui" content="4.7">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pulse Chart</title>
<style id="baseCss">
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#0A0B0D;color:#ECEEF1;overflow:hidden;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;font-size:13px}
#app{display:flex;flex-direction:column;height:100vh;width:100vw;background:#0A0B0D}
/* ---------- üst bar ---------- */
#top{display:flex;align-items:center;gap:6px;padding:5px 8px;border-bottom:1px solid #1C1F25;flex:none;
 overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.tb{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:7px;border:0;
 background:transparent;color:#C4CAD4;font:inherit;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.tb:hover{background:#171A1F;color:#ECEEF1}
.tb.on{background:#1B2130;color:#ECEEF1}
.tb svg{flex:none}
.sep{width:1px;height:18px;background:#22262D;flex:none;margin:0 2px}
.sp{flex:1}
.sym{font-weight:800;font-size:14px;color:#ECEEF1;padding:0 8px 0 2px;white-space:nowrap}
.srcchip{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.srcchip.real{color:#34D399;background:rgba(52,211,153,.11)}
.srcchip.mock{color:#F5B544;background:rgba(245,181,68,.13);border:1px dashed rgba(245,181,68,.45)}
/* ---------- gövde ---------- */
#body{flex:1;display:flex;min-height:0}
#tools{width:42px;flex:none;border-right:1px solid #1C1F25;display:flex;flex-direction:column;align-items:center;
 gap:2px;padding:6px 0;overflow-y:auto;scrollbar-width:none}
#tools::-webkit-scrollbar{display:none}
.tl{width:32px;height:32px;border-radius:7px;border:0;background:transparent;color:#A3ABB8;cursor:pointer;
 display:flex;align-items:center;justify-content:center;position:relative;flex:none}
.tl:hover{background:#171A1F;color:#ECEEF1}
.tl.on{background:#1B2130;color:#5B8CFF}
.tl.has::after{content:"";position:absolute;right:3px;bottom:3px;width:0;height:0;
 border-left:4px solid transparent;border-bottom:4px solid #4A515C}
.tsep{width:22px;height:1px;background:#22262D;margin:4px 0;flex:none}
#wrap{flex:1;position:relative;min-width:0;touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
#legend{position:absolute;left:8px;top:6px;pointer-events:none;font-size:12px;line-height:1.5;
 max-width:calc(100% - 120px);background:rgba(10,11,13,.62);border-radius:7px;padding:3px 7px}
#legend .r{white-space:nowrap}
#legend b{font-weight:700}
#legend .nm{color:#C4CAD4;font-weight:700}
#legend .v{font-variant-numeric:tabular-nums}
#hint{position:absolute;left:50%;transform:translateX(-50%);bottom:34px;background:#171A1F;border:1px solid #2A2F37;
 border-radius:8px;padding:6px 12px;font-size:12px;color:#C4CAD4;display:none;pointer-events:none;white-space:nowrap}
#ctl{position:absolute;right:6px;bottom:30px;display:flex;flex-direction:column;gap:3px}
.cb{width:26px;height:22px;border-radius:5px;border:1px solid #22262D;background:#111317;color:#8D96A5;
 font-size:10px;font-weight:800;cursor:pointer;padding:0}
.cb.on{color:#5B8CFF;border-color:#2F3B52}
.cb:hover{color:#ECEEF1}
/* ---------- açılır menü ---------- */
.pop{position:absolute;z-index:40;background:#111317;border:1px solid #2A2F37;border-radius:10px;
 box-shadow:0 12px 32px rgba(0,0,0,.6);padding:6px;display:none;min-width:196px;max-height:82vh;overflow:auto}
.pop.show{display:block}
.pop .h{font-size:11px;font-weight:800;letter-spacing:.04em;color:#6B7383;padding:7px 10px 4px}
.pop .it{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:7px;cursor:pointer;
 color:#C4CAD4;font-size:12.5px;white-space:nowrap}
.pop .it:hover{background:#1A1D23;color:#ECEEF1}
.pop .it.on{color:#5B8CFF}
.pop .it .ic{width:16px;display:flex;justify-content:center;flex:none;color:#8D96A5}
.pop .it.on .ic{color:#5B8CFF}
.pop .sub{font-size:11px;color:#6B7383;margin-left:auto;padding-left:14px}
.pop .div{height:1px;background:#22262D;margin:5px 2px}
.swgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:1px 9px 6px}
.swt{width:17px;height:17px;border-radius:4px;border:1px solid rgba(255,255,255,.16);cursor:pointer;padding:0}
.swt:hover{transform:scale(1.14)}
.swt.on{outline:2px solid #ECEEF1;outline-offset:1px}
.pop.style .it{padding:5px 9px;font-size:12px;gap:7px}
.pop.style{min-width:172px}
.pop.style input[type=color]{width:30px;height:24px}
.pop.style select{height:27px;font-size:12px;padding:0 6px}
.srch{display:flex;align-items:center;gap:8px;padding:0 0 4px 0}
.srch input{flex:1;height:34px}
/* ---------- diyalog ---------- */
#mask{position:absolute;inset:0;background:rgba(5,6,8,.55);z-index:50;display:none}
#mask.show{display:block}
.modal{position:absolute;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);background:#111317;
 border:1px solid #2A2F37;border-radius:14px;box-shadow:0 20px 50px rgba(0,0,0,.7);width:min(560px,94vw);
 max-height:88vh;overflow:auto;display:none}
.modal.show{display:block}
.mh{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #1C1F25}
.mh b{font-size:14.5px;font-weight:800}
.mb{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.mf{padding:12px 16px;border-top:1px solid #1C1F25;display:flex;gap:8px;justify-content:flex-end}
.x{margin-left:auto;width:26px;height:26px;border-radius:6px;border:0;background:transparent;color:#8D96A5;
 cursor:pointer;font-size:16px;line-height:1}
.x:hover{background:#1A1D23;color:#ECEEF1}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.row .lbl{font-size:12.5px;color:#C4CAD4;min-width:132px}
input[type=number],input[type=text],select{height:32px;border-radius:7px;border:1px solid #2A2F37;background:#0C0D10;
 color:#ECEEF1;font:inherit;font-size:12.5px;padding:0 9px;outline:none;min-width:0}
input[type=number]{width:74px;font-variant-numeric:tabular-nums}
input:focus,select:focus{border-color:#3C5A95}
input[type=color]{width:34px;height:28px;padding:1px;border-radius:6px;border:1px solid #2A2F37;background:#0C0D10;
 cursor:pointer}
.btn{height:32px;padding:0 14px;border-radius:8px;border:1px solid #2A2F37;background:#15181D;color:#ECEEF1;
 font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
.btn:hover{background:#1A1D23}
.btn.pri{background:#5B8CFF;border-color:#5B8CFF;color:#0A0B0D}
.btn.pri:hover{background:#6E9AFF}
.btn.dgr{color:#F87171;border-color:#3A2024}
.card{border:1px solid #22262D;border-radius:10px;padding:11px 12px;background:#0C0D10}
.card .ch{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.card .ch b{font-size:12.5px}
.sw{position:relative;width:34px;height:19px;border-radius:999px;background:#2A2F37;cursor:pointer;flex:none;
 transition:background .12s}
.sw i{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:#8D96A5;
 transition:transform .12s,background .12s}
.sw.on{background:#2F4A86}.sw.on i{transform:translateX(15px);background:#5B8CFF}
.muted{color:#8D96A5;font-size:11.5px}
.alist{display:flex;flex-direction:column;gap:6px}
.ar{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid #22262D;border-radius:8px;
 background:#0C0D10;font-size:12.5px}
.ar .del{margin-left:auto;background:transparent;border:0;color:#8D96A5;cursor:pointer;font-size:14px}
.ar .del:hover{color:#F87171}
.tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:2px 7px}
#toast{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:70;display:flex;flex-direction:column;
 gap:6px;align-items:center;pointer-events:none}
.tm{background:#15181D;border:1px solid #2A2F37;border-radius:9px;padding:8px 14px;font-size:12.5px;
 box-shadow:0 8px 24px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="sym" id="symName">—</span>
    <span class="srcchip real" id="srcChip">live data</span>
    <span class="sep"></span>
    <button class="tb" id="btnIv" title="Candle interval">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 1.8"/></svg>
      <span id="ivLbl">1D</span><span style="color:#6B7383">▾</span></button>
    <button class="tb" id="btnType">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
        <path d="M7 4v16M7 8h3V16H7zM17 6v12M17 9h3v6h-3z" stroke-linejoin="round"/></svg>
      <span id="typeLbl">Candles</span><span style="color:#6B7383">▾</span></button>
    <button class="tb" id="btnInd">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 4-7 5 5"/></svg>
      Indicators</button>
    <button class="tb" id="btnAlert">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
        stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/>
        <path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      Alert</button>
    <span class="sp"></span>
    <button class="tb" id="btnUndo" title="Undo (Ctrl+Z)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12H8"/></svg></button>
    <button class="tb" id="btnRedo" title="Redo (Ctrl+Y)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h6"/></svg></button>
    <button class="tb" id="btnFit" title="Fit all">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5"/></svg></button>
    <button class="tb" id="btnBig" title="Enlarge / shrink panel">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"><path d="M4 14h6v6M20 10h-6V4"/></svg></button>
    <button class="tb" id="btnFull" title="Fullscreen (F)">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
        stroke-linecap="round" stroke-linejoin="round"><path d="M3 9V3h6M21 15v6h-6M21 9V3h-6M3 15v6h6"/></svg>
      <span id="fullLbl">Fullscreen</span></button>
  </div>
  <div id="body">
    <div id="tools"></div>
    <div id="wrap">
      <canvas id="cv"></canvas>
      <div id="legend"></div>
      <div id="hint"></div>
      <div id="ctl">
        <button class="cb" id="cbIn" title="Zoom in (+)">＋</button>
        <button class="cb" id="cbOut" title="Zoom out (−)">−</button>
        <button class="cb" id="cbUp" title="Scroll up (↑ · Shift + wheel · drag)">▲</button>
        <button class="cb" id="cbDown" title="Scroll down (↓ · Shift + wheel · drag)">▼</button>
        <button class="cb" id="cbReset" title="Reset view">⟲</button>
        <button class="cb" id="cbAuto" title="Auto scale">A</button>
        <button class="cb" id="cbLog" title="Log scale">L</button>
      </div>
    </div>
  </div>
</div>
<div class="pop" id="pop"></div>
<div id="mask"></div>
<div class="modal" id="modal"></div>
<div id="toast"></div>

<script>
"use strict";
/* ==================================================================================
   Pulse Chart — TradingView tarzı grafik motoru (bağımlılık yok, tek dosya)
   - Gerçek OHLCV ve gerçek indikatör serileri Python tarafından gönderilir
   - Çizim araçları, zoom/pan/pinch, çoklu panel, alarmlar burada
   ================================================================================== */
let UP="#26A69A", DOWN="#EF5350", TXT="#ECEEF1", MUT="#8D96A5", SOFT="#C4CAD4", GRID="#1A1D23",
      ACC="#5B8CFF", WARN="#F5B544", LINE="#22262D", BG="#0A0B0D", PANEL="#111317", VIOLET="#C4B5FD";
/* beyaz tema: koyu renkler açık karşılıklarına çevrilir (CSS + canvas) */
const LMAP={"#0A0B0D":"#FFFFFF","#0C0D10":"#F3F5F8","#111317":"#FFFFFF","#15181D":"#F0F2F5","#171A1F":"#EEF0F3",
  "#1A1D23":"#ECEEF2","#1B2130":"#E3EAF8","#1C1F25":"#E6E8EC","#22262D":"#E1E4EA","#2A2F37":"#D9DDE3",
  "#3A404A":"#C5CAD2","#4A515C":"#B4BAC4","#2F3B52":"#BFCDEB","#ECEEF1":"#14171C","#C4CAD4":"#2E3440",
  "#A3ABB8":"#4A5260","#9AA4B2":"#56606E","#8D96A5":"#5F6878","#6B7383":"#6F7787","#5A6372":"#7A8292",
  "#C4B5FD":"#7C5CDB","#F5B544":"#B7791F","#5B8CFF":"#3B6EF5","#34D399":"#0B9466","#F87171":"#DC2F3E"};
function lm(v){
  if(!S.light||typeof v!=="string") return v;
  const k=v.toUpperCase(); if(LMAP[k]) return LMAP[k];
  // koyu yarı saydam etiket zeminleri → beyaz (rgba(10,11,13,.7) gibi)
  const m=/^rgba\((\d+),\s*(\d+),\s*(\d+),\s*([\d.]+)\)$/.exec(v);
  if(m&&+m[1]<45&&+m[2]<45&&+m[3]<45) return "rgba(255,255,255,"+Math.min(0.92,Math.max(0.7,+m[4]))+")";
  return v;
}
function setPalette(light){
  if(S.light===light&&S.palSet) return;
  S.light=!!light; S.palSet=true;
  TXT=lm("#ECEEF1"); MUT=lm("#8D96A5"); SOFT=lm("#C4CAD4"); GRID=lm("#1A1D23"); ACC=lm("#5B8CFF");
  WARN=lm("#F5B544"); LINE=lm("#22262D"); BG=lm("#0A0B0D"); PANEL=lm("#111317"); VIOLET=lm("#C4B5FD");
  if(!light){ TXT="#ECEEF1"; MUT="#8D96A5"; SOFT="#C4CAD4"; GRID="#1A1D23"; ACC="#5B8CFF"; WARN="#F5B544";
    LINE="#22262D"; BG="#0A0B0D"; PANEL="#111317"; VIOLET="#C4B5FD"; }
  const st=document.getElementById("baseCss");
  if(st){ if(!st.dataset.dark) st.dataset.dark=st.textContent;
    st.textContent = light ? st.dataset.dark.replace(/#[0-9A-Fa-f]{6}\b/g,function(h){return LMAP[h.toUpperCase()]||h;})
                             .replace("rgba(10,11,13,.62)","rgba(255,255,255,.78)").replace(/rgba\(0,0,0,\.6\)/g,"rgba(20,23,28,.18)")
                           : st.dataset.dark; }
  document.body.classList.toggle("light",!!light);
}
/* canvas: sabit yazılmış koyu renkler de çevrilsin */
(function(){
  const P=CanvasRenderingContext2D.prototype;
  const fs=Object.getOwnPropertyDescriptor(P,"fillStyle"), ss=Object.getOwnPropertyDescriptor(P,"strokeStyle");
  Object.defineProperty(P,"fillStyle",{configurable:true,get:function(){return fs.get.call(this);},
    set:function(v){fs.set.call(this,lm(v));}});
  Object.defineProperty(P,"strokeStyle",{configurable:true,get:function(){return ss.get.call(this);},
    set:function(v){ss.set.call(this,lm(v));}});
})();
const PS=68, TS=24, MINPANE=56, RMARGIN=0.12;   // PS: fiyat ekseninin en dar hali (v4.2: S.ps dinamik)
const LBL_H=18, LBL_GAP=3, TAG_H=18, TAG_GAP=2;
const TR=new Intl.NumberFormat("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

/* ---------------------------------------------------------------- yardımcılar */
function fmt(v,d){ if(v==null||!isFinite(v)) return "—";
  return new Intl.NumberFormat("en-US",{minimumFractionDigits:d,maximumFractionDigits:d}).format(v); }
function fmtP(v){ return fmt(v, S.dec); }
function pct(v){ return (v>=0?"+":"−")+fmt(Math.abs(v),2)+"%"; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function dateOf(t){ return new Date(t); }
function dstr(t){ const d=dateOf(t); return MON[d.getUTCMonth()]+" "+d.getUTCDate()+", "+d.getUTCFullYear(); }
function tstr(t){ const d=dateOf(t);
  return String(d.getUTCHours()).padStart(2,"0")+":"+String(d.getUTCMinutes()).padStart(2,"0"); }
function dtstr(t){ return S.intraday ? dstr(t)+" "+tstr(t) : dstr(t); }
function uid(){ return "d"+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function el(tag,cls,html){ const e=document.createElement(tag); if(cls)e.className=cls;
  if(html!=null)e.innerHTML=html; return e; }
function near(x,y,x1,y1,x2,y2,tol){ // nokta-doğru parçası uzaklığı
  const dx=x2-x1, dy=y2-y1, L=dx*dx+dy*dy;
  let t = L? ((x-x1)*dx+(y-y1)*dy)/L : 0; t=clamp(t,0,1);
  const px=x1+t*dx, py=y1+t*dy;
  return Math.hypot(x-px,y-py)<=tol;
}

/* ---------------------------------------------------------------- durum */
const S={
  sym:"", name:"", dec:2, src:"real", intraday:false, interval:"1G",
  bars:[], ha:[], ind:{}, zones:[], gaps:[], divs:[], cfg:{}, alerts:[], draws:[],
  type:"candles", view:{a:0,b:50}, yAuto:true, yLog:false, yMan:null,
  panes:[], cross:null, tool:null, pend:null, sel:null, drag:null,
  undo:[], redo:[], rev:-1, height:620, big:false, sentN:0, ready:false,
  ivList:[["1d","Daily","1D"]], ivName:"Daily",
  ps:68, lane:[], tags:[], patLbl:[], drawn:[], grow:0, args:null, hmin:620
};
const cv=document.getElementById("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1;

/* ---------------------------------------------------------------- Streamlit köprüsü */
const inStreamlit = window.parent && window.parent !== window;
function stSend(type,data){ if(!inStreamlit) return;
  window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},data||{}),"*"); }
function setFrameHeight(h){ stSend("streamlit:setFrameHeight",{height:Math.round(h)}); }
function send(kind,payload){
  S.sentN++;
  stSend("streamlit:setComponentValue",
    {value:Object.assign({kind:kind,n:S.sentN,sym:S.sym},payload),dataType:"json"});
}
window.addEventListener("message",function(e){
  const d=e.data||{};
  if(d.type==="streamlit:render") applyArgs(d.args||{});
});

function applyArgs(a){
  setPalette(!!a.light);
  const symChanged = a.sym!==S.sym || a.interval!==S.interval || (a.lookback||"")!==(S.lookback||"");
  S.lookback=a.lookback||""; S.visible=a.visible||0;
  const dataRev = a.rev==null?0:a.rev;
  S.sym=a.sym||""; S.name=a.name||S.sym; S.dec=a.dec==null?2:a.dec; S.src=a.src||"real";
  S.intraday=!!a.intraday; S.interval=a.interval||"1G";
  S.bars=(a.bars||[]).map(function(b){return {t:b[0],o:b[1],h:b[2],l:b[3],c:b[4],v:b[5]};});
  S.ind=a.ind||{}; S.zones=a.zones||[]; S.gaps=a.gaps||[]; S.divs=a.divs||[]; S.cfg=a.cfg||{};
  S.ov=a.ov||null;   // v4.0: formasyon çizgileri, order block'lar, yüksek hacimli alım/satım işaretleri, dark pool
  S.args=a;
  if(symChanged) S.grow=0;
  if(a.intervals&&a.intervals.length) S.ivList=a.intervals;
  S.ivName=a.intervalName||S.interval;
  if(a.type) S.type=a.type;
  // çizimler ve alarmlar: sembol değiştiyse ya da Python daha yeni bir sürüm gönderdiyse al
  if(symChanged || dataRev>S.rev){
    S.draws=(a.draws||[]).map(normDraw); S.alerts=a.alerts||[];
    S.sel=null; S.undo=[]; S.redo=[];
  }
  S.rev=dataRev;
  S.ha=heikin(S.bars);
  buildPanes();
  S.height=fitHeight(a);
  if(symChanged || !S.ready){ fitView(); }
  else { clampView(); }
  S.ready=true;
  renderTools(); syncTop();
  // Streamlit iframe'i yüksekliği bilmez; her render'da bildir
  setFrameHeight(S.big?Math.max(560,(window.screen&&window.screen.height||900)*0.82):S.height);
  setTimeout(resize,30); resize();
}
/* v4.2: yükseklik ekrana göre ölçeklenir (fit = görünür pencerenin oranı), fiyat paneli en az pmin piksel kalır,
   etiket şeridi sığmazsa hmax'a kadar uzar */
function viewportH(){
  let h=0;
  try{ h=(window.parent&&window.parent!==window&&window.parent.innerHeight)||0; }catch(e){ h=0; }
  if(!h){ try{ h=Math.max(0,((window.screen&&window.screen.availHeight)||0)-170); }catch(e){ h=0; } }
  return h;
}
function priceH(h){
  const plotH=h-TS; let sub=0;
  for(let i=1;i<S.panes.length;i++) sub+=Math.max(MINPANE, plotH*S.panes[i].w*0.42);
  sub=Math.min(sub, plotH*0.58);
  return plotH-sub;
}
function fitHeight(a){
  let h=a.height||620;
  const hmax=a.hmax>0?a.hmax:0;
  if(a.fit>0){ const vh=viewportH(); if(vh>0) h=Math.max(h, Math.round(vh*a.fit)); }
  if(a.pmin>0){ let k=0; while(priceH(h)<a.pmin&&k<60&&(!hmax||h<hmax)){ h+=20; k++; } }
  h+=S.grow||0;
  if(hmax) h=Math.min(h, Math.max(hmax, a.height||620));
  return Math.round(h);
}
function refit(){
  if(!S.args) return;
  const h=fitHeight(S.args);
  if(Math.abs(h-S.height)>8){ S.height=h; if(!S.big&&!fsOn()){ setFrameHeight(h); setTimeout(resize,40); } }
}
try{ if(window.parent&&window.parent!==window){
  let tm=null; window.parent.addEventListener("resize",function(){ clearTimeout(tm); tm=setTimeout(refit,250); });
} }catch(e){}
function normDraw(d){ d.pts=(d.pts||[]).map(function(p){return {t:p.t,p:p.p};}); return d; }

/* ---------------------------------------------------------------- veri yardımcıları */
function heikin(bars){
  const out=[]; let po=null,pc=null;
  for(let i=0;i<bars.length;i++){
    const b=bars[i], c=(b.o+b.h+b.l+b.c)/4;
    const o = po==null ? (b.o+b.c)/2 : (po+pc)/2;
    out.push({t:b.t,o:o,h:Math.max(b.h,o,c),l:Math.min(b.l,o,c),c:c,v:b.v});
    po=o; pc=c;
  }
  return out;
}
function series(){ return S.type==="heikin" ? S.ha : S.bars; }
function iOfT(t){ // zaman damgasından (kesirli) bar indeksi
  const b=S.bars, n=b.length;
  if(!n) return 0;
  if(t<=b[0].t) { const step=n>1?(b[1].t-b[0].t):1; return (t-b[0].t)/step; }
  if(t>=b[n-1].t){ const step=n>1?(b[n-1].t-b[n-2].t):1; return n-1+(t-b[n-1].t)/step; }
  let lo=0,hi=n-1;
  while(hi-lo>1){ const m=(lo+hi)>>1; if(b[m].t<=t) lo=m; else hi=m; }
  const span=b[hi].t-b[lo].t || 1;
  return lo+(t-b[lo].t)/span;
}
function tOfI(i){
  const b=S.bars, n=b.length;
  if(!n) return 0;
  if(i<=0){ const step=n>1?(b[1].t-b[0].t):86400000; return b[0].t+i*step; }
  if(i>=n-1){ const step=n>1?(b[n-1].t-b[n-2].t):86400000; return b[n-1].t+(i-(n-1))*step; }
  const lo=Math.floor(i), f=i-lo;
  return b[lo].t+(b[lo+1].t-b[lo].t)*f;
}

/* ---------------------------------------------------------------- paneller */
function buildPanes(){
  const c=S.cfg, p=[{id:"price",w:1}];
  if(c.vol&&c.vol.on) p.push({id:"vol",w:.22,name:"Volume"});
  if(c.rsi&&c.rsi.on) p.push({id:"rsi",w:.3,name:"RSI ("+(c.rsi.len||14)+")"});
  if(c.stoch&&c.stoch.on) p.push({id:"stoch",w:.3,name:"Stochastic"});
  if(c.macd&&c.macd.on) p.push({id:"macd",w:.3,name:"MACD ("+c.macd.f+", "+c.macd.s+", "+c.macd.sig+")"});
  if(c.wt&&c.wt.on) p.push({id:"wt",w:.3,name:"WaveTrend ("+c.wt.n1+", "+c.wt.n2+")"});
  if(c.atr&&c.atr.on) p.push({id:"atr",w:.24,name:"ATR"});
  S.panes=p;
}
/* cfg'den renk oku (geçersizse varsayılan) */
function CC(k,f,d){ const c=S.cfg[k], v=c&&c[f];
  return (typeof v==="string"&&/^#[0-9a-fA-F]{6}$/.test(v))?v:d; }
function layout(){
  const plotH=H-TS;
  let sub=0;
  for(let i=1;i<S.panes.length;i++) sub+=Math.max(MINPANE, plotH*S.panes[i].w*0.42);
  sub=Math.min(sub, plotH*0.58);
  const subEach = S.panes.length>1 ? sub/(S.panes.length-1) : 0;
  let y=0;
  for(let i=0;i<S.panes.length;i++){
    const pn=S.panes[i];
    pn.top=y; pn.h = i===0 ? plotH-sub : subEach; y+=pn.h;
  }
  S.ps=axisWidth();
  S.plotW=Math.max(40,W-S.ps);
}
/* v4.2: fiyat ekseni en geniş etikete göre genişler (ör. "TP2 1,234.56"); hiçbir etiket kesilmez */
function axisWidth(){
  if(!S.bars.length) return PS;
  ctx.save(); ctx.font="bold 11px sans-serif";
  let mx=0, hi=0;
  for(const b of S.bars){ if(b.h>hi) hi=b.h; }
  const txt=[fmtP(hi*1.15), fmtP(-hi*0.01)];
  for(const l of planLevels()) txt.push(tagText(l)+" ▲");
  for(const t of txt){ const w=ctx.measureText(t).width; if(w>mx) mx=w; }
  ctx.restore();
  return Math.max(PS, Math.min(Math.max(PS, W*0.24), Math.ceil(mx+16)));
}
function planLevels(){
  if(!S.ov||!ovOn("patterns")) return [];
  return (S.ov.levels||[]).filter(function(l){ return l&&isFinite(l.price); });
}
function tagText(l){ return (l.label?l.label+" ":"")+fmtP(l.price); }
function paneAt(y){ for(const p of S.panes) if(y>=p.top&&y<p.top+p.h) return p; return S.panes[0]; }

/* ---------------------------------------------------------------- ölçekler */
function X(i){ const v=S.view; return (i-v.a)/(v.b-v.a)*S.plotW; }
function I(x){ const v=S.view; return v.a + x/S.plotW*(v.b-v.a); }
function bw(){ return S.plotW/(S.view.b-S.view.a); }
function lg(v){ return Math.log(Math.max(1e-9,v)); }
function Y(p,price){
  if(price==null||!isFinite(price)) return NaN;
  if(p.id==="price"&&S.yLog){
    const a=lg(p.min), b=lg(p.max);
    return p.top + (b-lg(price))/(b-a||1)*p.h;
  }
  return p.top + (p.max-price)/((p.max-p.min)||1)*p.h;
}
function PR(p,y){
  if(p.id==="price"&&S.yLog){
    const a=lg(p.min), b=lg(p.max);
    return Math.exp(b-(y-p.top)/p.h*(b-a));
  }
  return p.max - (y-p.top)/p.h*(p.max-p.min);
}
function visRange(){
  return [Math.max(0,Math.floor(S.view.a)), Math.min(S.bars.length-1,Math.ceil(S.view.b))];
}
function autoScale(){
  const [i0,i1]=visRange(), bars=series();
  for(const p of S.panes){
    let mn=Infinity,mx=-Infinity;
    if(p.id==="price"){
      for(let i=i0;i<=i1;i++){ const b=bars[i]; if(!b)continue; if(b.l<mn)mn=b.l; if(b.h>mx)mx=b.h; }
      const ov=overlaySeries();
      for(const s of ov) for(let i=i0;i<=i1;i++){ const v=s[i];
        if(v==null||!isFinite(v))continue; if(v<mn)mn=v; if(v>mx)mx=v; }
      if(S.cfg.zones&&S.cfg.zones.on) for(const z of S.zones){
        if(z.hi>mn*0.55&&z.lo<mx*1.45){ /* bantlar görünür aralıktaysa hafifçe dahil et */ }
      }
      for(const a of S.alerts) if(a.price>mn*0.8&&a.price<mx*1.2){ mn=Math.min(mn,a.price); mx=Math.max(mx,a.price); }
      // v4.2: işlem planı (Stop / TP1 / TP2 …) her zaman görünür; canlı order block'lar ve dark pool seviyeleri yakınsa
      const lastC=bars.length?bars[bars.length-1].c:0;
      for(const l of planLevels()){ mn=Math.min(mn,l.price); mx=Math.max(mx,l.price); }
      if(S.ov&&lastC>0){
        if(ovOn("obs")) for(const o of (S.ov.obs||[])){ if(o.end!=null) continue;
          if(o.lo>lastC*0.75&&o.hi<lastC*1.25){ mn=Math.min(mn,o.lo); mx=Math.max(mx,o.hi); } }
        if(ovOn("prints")) for(const d of (S.ov.prints||[])){
          if(d.price>lastC*0.85&&d.price<lastC*1.15){ mn=Math.min(mn,d.price); mx=Math.max(mx,d.price); } }
      }
      if(S.yMan&&!S.yAuto){ mn=S.yMan.min; mx=S.yMan.max; }
    } else if(p.id==="vol"){
      mn=0; for(let i=i0;i<=i1;i++){ const b=S.bars[i]; if(b&&b.v>mx)mx=b.v; }
      if(!isFinite(mx)||mx<=0)mx=1;
    } else if(p.id==="rsi"||p.id==="stoch"){ mn=0;mx=100; }
    else {
      const ks = p.id==="macd" ? ["macd","macd_sig","macd_hist"]
               : p.id==="atr" ? ["atr"] : ["wt1","wt2"];
      for(const k of ks){ const s=S.ind[k]; if(!s)continue;
        for(let i=i0;i<=i1;i++){ const v=s[i]; if(v==null||!isFinite(v))continue;
          if(v<mn)mn=v; if(v>mx)mx=v; } }
      if(!isFinite(mn)){ mn=-1;mx=1; }
      const pad=(mx-mn)*0.12||1; mn-=pad; mx+=pad;
    }
    if(!isFinite(mn)||!isFinite(mx)||mn===mx){ mn=(mn||0)-1; mx=(mx||0)+1; }
    if(p.id==="price"&&!(S.yMan&&!S.yAuto)){
      // kenardaki etiketlerin yarısı dışarı taşmasın: en az ~14 px boşluk
      const r=mx-mn, pad=Math.max(r*0.08, r*14/Math.max(60,p.h-28));
      if(S.yLog&&mn>0){ const a=lg(mn), b=lg(mx), lp=Math.max((b-a)*0.08,(b-a)*14/Math.max(60,p.h-28));
        mn=Math.exp(a-lp); mx=Math.exp(b+lp); }
      else { mn-=pad; mx+=pad; }
    }
    p.min=mn; p.max=mx;
  }
}
function overlaySeries(){
  const out=[], c=S.cfg;
  if(c.sma&&c.sma.on) for(const n of (c.sma.ps||[])){ const s=S.ind["sma"+n]; if(s)out.push(s); }
  if(c.nw&&c.nw.on){ for(const k of ["nw_up","nw_lo"]){ const s=S.ind[k]; if(s)out.push(s); } }
  if(c.boll&&c.boll.on){ for(const k of ["bb_up","bb_lo"]){ const s=S.ind[k]; if(s)out.push(s); } }
  if(c.sup&&c.sup.on&&S.ind.sup) out.push(S.ind.sup);
  if(c.vstop&&c.vstop.on&&S.ind.vstop) out.push(S.ind.vstop);
  if(c.vidya&&c.vidya.on){ for(const k of ["vid","vid_up","vid_lo"]){ const s=S.ind[k]; if(s)out.push(s); } }
  return out;
}
function niceStep(range,target){
  const raw=range/Math.max(1,target), p=Math.pow(10,Math.floor(Math.log10(raw))), f=raw/p;
  return (f<=1?1:f<=2?2:f<=5?5:10)*p;
}

/* ---------------------------------------------------------------- görünüm */
function fitView(){
  const n=S.bars.length;
  const want=Math.max(1, Math.min(n, S.visible>0 ? S.visible : (S.intraday?180:150)));
  S.view.b=n+Math.max(4,want*RMARGIN); S.view.a=S.view.b-Math.max(10,want*(1+RMARGIN));
  S.yAuto=true; S.yMan=null;
  S.fitR={want:want,n:0,all:false}; S.fitSig=null;
}
function fitAll(){
  const n=S.bars.length;
  S.view.a=-2; S.view.b=n+Math.max(4,n*0.06); S.yAuto=true; S.yMan=null;
  S.fitR={want:n+2,n:0,all:true}; S.fitSig=null;
  draw();
}
/* v4.2: otomatik görünümde sağ boşluk etiket şeridi kadar açılır — etiketler son mumların üstüne binmez.
   Kullanıcı kaydırır / yakınlaştırırsa (görünüm değişirse) bu ayar bırakılır. */
function applyFitRight(){
  const f=S.fitR, v=S.view; if(!f) return false;
  if(S.fitSig&&(Math.abs(v.a-S.fitSig[0])>1e-6||Math.abs(v.b-S.fitSig[1])>1e-6)){ S.fitR=null; return false; }
  if(f.n>=4) return false;
  const n=S.bars.length, needPx=Math.min(S.plotW*0.42,(S.laneW>0?S.laneW+18:0));
  const m=needPx>0?needPx*f.want/Math.max(40,S.plotW-needPx):0;
  const base=f.all?Math.max(4,n*0.06):Math.max(4,f.want*RMARGIN);
  const b=n+Math.max(base,m), a=f.all?-2:Math.min(n-f.want,b-10);
  if(Math.abs(b-v.b)<0.25&&Math.abs(a-v.a)<0.25){ S.fitSig=[v.a,v.b]; return false; }
  v.a=a; v.b=b; S.fitSig=[a,b]; f.n++;
  return true;
}
function clampView(){
  const n=Math.max(2,S.bars.length), v=S.view;
  let span=v.b-v.a;
  span=clamp(span,4,Math.max(20,n*3));
  if(v.a<-n*0.5){ v.a=-n*0.5; }
  if(v.a>n-3){ v.a=n-3; }
  v.b=v.a+span;
}
/* fiyat eksenini dikey kaydır: frac>0 → içerik aşağı iner (daha yüksek fiyatlar görünür) */
function panY(frac, base){
  const P=S.panes[0]; if(!P) return;
  const mn=base?base.min:P.min, mx=base?base.max:P.max;
  if(S.yLog){ const a=lg(mn), b=lg(mx), sh=frac*(b-a); S.yMan={min:Math.exp(a+sh), max:Math.exp(b+sh)}; }
  else { const sh=frac*(mx-mn); S.yMan={min:mn+sh, max:mx+sh}; }
  S.yAuto=false; syncTop(); draw();
}
function zoomAt(px,f){
  const v=S.view, i=I(px), span=(v.b-v.a)*f;
  const r=(i-v.a)/(v.b-v.a);
  v.a=i-span*r; v.b=v.a+span;
  clampView(); draw();
}

/* ---------------------------------------------------------------- çizim: ana */
function resize(){
  const wrap=document.getElementById("wrap");
  const r=wrap.getBoundingClientRect();
  W=Math.max(80,r.width); H=Math.max(120,r.height);
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout(); draw();
}
function draw(){
  if(!S.bars.length){ ctx.clearRect(0,0,W,H);
    ctx.fillStyle=MUT; ctx.font="13px sans-serif"; ctx.textAlign="center";
    ctx.fillText("No data", W/2, H/2); return; }
  layout(); autoScale();
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  drawGrid();
  S.lane=[]; S.patLbl=[]; S.drawn=[];   // v4.2: etiketler önce toplanır, sonra çakışmasız yerleştirilir
  for(const p of S.panes){
    ctx.save(); ctx.beginPath(); ctx.rect(0,p.top,S.plotW,p.h); ctx.clip();
    if(p.id==="price"){ drawZones(p); drawGaps(p); drawOB(p); drawPrice(p); drawOverlays(p); drawDivPrice(p);
      drawPrints(p); drawPatterns(p); drawLevels(p); drawMarks(p); }
    else if(p.id==="vol") drawVol(p);
    else if(p.id==="rsi") drawRSI(p);
    else if(p.id==="stoch") drawStoch(p);
    else if(p.id==="macd") drawMACD(p);
    else if(p.id==="wt") drawWT(p);
    else if(p.id==="atr") drawATR(p);
    if(p.id!=="price") drawPaneTitle(p);
    ctx.restore();
  }
  const P0=S.panes[0];   // çizimler ve alarmlar yalnızca fiyat panelinde
  ctx.save(); ctx.beginPath(); ctx.rect(0,P0.top,S.plotW,P0.h); ctx.clip();
  drawDrawings(); drawAlerts();
  drawLane(P0); drawPatLabels(P0);
  ctx.restore();
  drawScales(); drawTimeAxis(); drawCross();
  updateLegend();
  if(applyFitRight()) requestAnimationFrame(draw);
}
function drawGrid(){
  ctx.lineWidth=1;
  for(const p of S.panes){
    const step=niceStep(p.max-p.min, Math.max(2,Math.floor(p.h/(p.id==="price"?46:26))));
    const start=Math.ceil(p.min/step)*step;
    ctx.strokeStyle=GRID; ctx.beginPath();
    for(let v=start;v<=p.max;v+=step){ const y=Math.round(Y(p,v))+0.5;
      if(y>p.top&&y<p.top+p.h){ ctx.moveTo(0,y); ctx.lineTo(S.plotW,y); } }
    ctx.stroke();
    p.step=step;
    if(p.top>0){ ctx.strokeStyle=LINE; ctx.beginPath();
      ctx.moveTo(0,Math.round(p.top)+0.5); ctx.lineTo(W,Math.round(p.top)+0.5); ctx.stroke(); }
  }
  // dikey ızgara
  ctx.strokeStyle=GRID; ctx.beginPath();
  for(const tk of timeTicks()){ const x=Math.round(X(tk.i))+0.5;
    ctx.moveTo(x,0); ctx.lineTo(x,H-TS); }
  ctx.stroke();
}
function timeTicks(){
  // Etiketler takvim sınırlarına oturur (ay / yıl / gün), araları en az 70px
  const out=[]; if(!S.bars.length) return out;
  const [i0,i1]=visRange(); let lastX=-1e9; const w=bw();
  function push(i,lab,strong){
    const x=X(i); if(x-lastX<70||x<10||x>S.plotW-10) return;
    lastX=x; out.push({i:i,lab:lab,strong:strong});
  }
  for(let i=Math.max(1,i0);i<=i1;i++){
    const pb=S.bars[i-1], b=S.bars[i]; if(!pb||!b) continue;
    const a=dateOf(pb.t), d=dateOf(b.t);
    if(S.intraday){
      if(a.getUTCDate()!==d.getUTCDate()) push(i,d.getUTCDate()+" "+MON[d.getUTCMonth()],true);
      else if(d.getUTCMinutes()===0) push(i,tstr(b.t),false);
    } else {
      if(a.getUTCFullYear()!==d.getUTCFullYear()) push(i,String(d.getUTCFullYear()),true);
      else if(a.getUTCMonth()!==d.getUTCMonth()) push(i,MON[d.getUTCMonth()],false);
      else if(w>13) push(i,String(d.getUTCDate()),false);
    }
  }
  if(!out.length&&S.bars[Math.max(0,i0)]) out.push({i:Math.max(0,i0),lab:dstr(S.bars[Math.max(0,i0)].t),strong:true});
  return out;
}
function drawTimeAxis(){
  const y=H-TS;
  ctx.fillStyle=BG; ctx.fillRect(0,y,W,TS);
  ctx.strokeStyle=LINE; ctx.beginPath(); ctx.moveTo(0,y+0.5); ctx.lineTo(W,y+0.5); ctx.stroke();
  ctx.font="11px sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  for(const tk of timeTicks()){
    const x=X(tk.i); if(x<16||x>S.plotW-16) continue;
    ctx.fillStyle=tk.strong?SOFT:MUT; ctx.fillText(tk.lab,x,y+TS/2);
  }
  if(S.cross){
    const t=tOfI(Math.round(S.cross.i));
    const lab=S.intraday?dstr(t)+" "+tstr(t):dstr(t);
    const w=ctx.measureText(lab).width+14;
    const x=clamp(X(Math.round(S.cross.i)),w/2,S.plotW-w/2);
    ctx.fillStyle="#2A2F37"; ctx.fillRect(x-w/2,y+2,w,TS-4);
    ctx.fillStyle=TXT; ctx.fillText(lab,x,y+TS/2);
  }
}
function drawScales(){
  const PSW=S.ps||PS;
  ctx.fillStyle=BG; ctx.fillRect(S.plotW,0,PSW,H-TS);
  ctx.strokeStyle=LINE; ctx.beginPath();
  ctx.moveTo(S.plotW+0.5,0); ctx.lineTo(S.plotW+0.5,H-TS); ctx.stroke();
  const tags=axisTags();
  ctx.font="11px sans-serif"; ctx.textAlign="left"; ctx.textBaseline="middle";
  for(const p of S.panes){
    if(p.id==="rsi"||p.id==="stoch"){   // sabit seviyeler daha okunur
      const c=(p.id==="rsi"?S.cfg.rsi:S.cfg.stoch)||{};
      for(const v of [c.ob||(p.id==="rsi"?70:80),50,c.os||(p.id==="rsi"?30:20)]){
        const y=Y(p,v); if(y<p.top+7||y>p.top+p.h-5) continue;
        ctx.fillStyle=MUT; ctx.fillText(String(v),S.plotW+7,y);
      }
      continue;
    }
    const step=p.step||niceStep(p.max-p.min,4), start=Math.ceil(p.min/step)*step;
    const dec = p.id==="price" ? S.dec : (p.id==="vol"?0
      : step>=10?0 : step>=1?1 : step>=0.1?2 : 3);
    for(let v=start;v<=p.max;v+=step){
      const y=Y(p,v); if(y<p.top+8||y>p.top+p.h-6) continue;

  }

  for(const t of tags){

      ctx.lineTo(S.plotW+3,t.ry); ctx.stroke();

    ctx.fillStyle=t.bg; roundRect(S.plotW+2,top,PSW-4,TAG_H,3); ctx.fill();
    ctx.fillStyle=t.fg; ctx.fillText(t.text,S.plotW+7,t.ry+0.5);
    S.drawn.push({kind:"tag:"+t.kind,text:t.text,x:S.plotW+2,y:top,w:PSW-4,h:TAG_H,
                  tw:ctx.measureText(t.text).width});
  }
  if(S.cross){
    const p=paneAt(S.cross.y), v=PR(p,S.cross.y);
    const dec=p.id==="price"?S.dec:(p.id==="vol"?0:1);
    const lab=p.id==="vol"?volLab(v):fmt(v,dec);
    ctx.fillStyle="#2A2F37"; ctx.fillRect(S.plotW+1,S.cross.y-9,PSW-1,18);
    ctx.fillStyle=TXT; ctx.font="bold 11px sans-serif";
    ctx.fillText(lab,S.plotW+7,S.cross.y);
  }
}
/* v4.2: eksen etiketlerini topla ve çakışmayacak şekilde dikey yay */
function axisTags(){
  const p=S.panes[0], out=[], bars=series(), last=bars[bars.length-1];
  if(!p) return out;
  if(last){
    const up=last.c>=last.o, y=Y(p,last.c);
    if(y>p.top-1&&y<p.top+p.h+1) out.push({kind:"last",y:y,text:fmtP(last.c),bg:up?UP:DOWN,fg:"#06110E",prio:9});
  }
  for(const l of planLevels()){
    let y=Y(p,l.price), txt=tagText(l);
    if(!isFinite(y)) continue;
    if(y<p.top){ y=p.top; txt+=" ▲"; } else if(y>p.top+p.h){ y=p.top+p.h; txt+=" ▼"; }
    out.push({kind:"level",y:y,text:txt,bg:l.color||ACCENT,fg:inkOn(l.color||ACCENT),prio:8});
  }
  spreadY(out,p.top+1,p.top+p.h-1,TAG_H,TAG_GAP);
  S.tags=out;
  return out;
}
/* koyu ya da açık yazı: arka plan rengine göre */
function inkOn(hex){
  const m=/^#([0-9a-f]{6})$/i.exec(hex||""); if(!m) return "#0A0B0D";
  const n=parseInt(m[1],16), r=n>>16&255, g=n>>8&255, b=n&255;
  return (0.299*r+0.587*g+0.114*b)>140?"#0A0B0D":"#FFFFFF";
}
/* Tek boyutlu yerleştirme: istenen y'lere en yakın, birbirine binmeyen konumlar (küme birleştirme).
   Sığmayanlar önceliğe göre düşer (it.drop=true). Sonuç: it.ry */
function spreadY(items,lo,hi,h,gap){
  const step=h+gap, half=h/2;
  const cap=Math.max(0,Math.floor((hi-lo+gap)/step));
  for(const it of items) it.drop=false;
  if(items.length>cap){
    const idx=items.map(function(it,k){return [it,k];});
    idx.sort(function(a,b){return (b[0].prio||0)-(a[0].prio||0) || a[1]-b[1];});
    const byP=idx.map(function(q){return q[0];});
    for(let k=cap;k<byP.length;k++) byP[k].drop=true;
  }
  const list=items.filter(function(it){return !it.drop;}).sort(function(a,b){return a.y-b.y;});
  function place(c){
    const n=c.items.length;
    let top=c.sum/n-(n-1)*step/2;
    top=Math.min(hi-half-(n-1)*step, top);
    top=Math.max(lo+half, top);
    c.top=top;
  }
  const cl=[];
  for(const it of list){
    cl.push({items:[it],sum:clamp(it.y,lo+half,hi-half)});
    for(;;){
      const c=cl[cl.length-1]; place(c);
      if(cl.length<2) break;
      const pv=cl[cl.length-2];
      if(pv.top+pv.items.length*step>c.top+1e-6){ pv.items=pv.items.concat(c.items); pv.sum+=c.sum; cl.pop(); }
      else break;
    }
  }
  for(const c of cl){ place(c); c.items.forEach(function(it,k){ it.ry=c.top+k*step; }); }
  return items.filter(function(it){return it.drop;}).length;
}
/* v4.2: işlem planı çizgileri (seviye / stop / hedefler) — etiketleri fiyat ekseninde */
function drawLevels(p){
  const lv=planLevels(); if(!lv.length) return;
  ctx.save();
  for(const l of lv){
    const y=Y(p,l.price); if(!isFinite(y)||y<p.top||y>p.top+p.h) continue;
    const col=l.color||ACCENT, x0=l.from==null?0:Math.max(0,X(l.from));
    ctx.setLineDash([6,4]); ctx.strokeStyle=hexa(col,.9); ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(x0,Math.round(y)+0.5); ctx.lineTo(S.plotW,Math.round(y)+0.5); ctx.stroke();
    ctx.setLineDash([]);
  }

  const st=lv.find(function(l){return /^stop/i.test(l.label||"");});
  const en=lv.find(function(l){return /^(level|entry)/i.test(l.label||"");});
  const tp=lv.find(function(l){return /^(tp1|target)/i.test(l.label||"");});
  if(st&&en&&tp){

}

function drawLane(p){

  const maxW=Math.max(60,S.plotW*0.34);   // daha genişse kısa metin (ör. "Bull OB 2.4×")
  for(const it of S.lane){

    it.t=t; it.w=Math.min(w,Math.max(60,S.plotW-16));
  }
  const dropped=spreadY(S.lane,p.top+3,p.top+p.h-3,LBL_H,LBL_GAP);
  for(const it of S.lane){
    if(it.drop) continue;
    const x=S.plotW-8-it.w, top=it.ry-LBL_H/2;
    if(Math.abs(it.ry-it.y)>1.5){
      ctx.strokeStyle=hexa(it.color,.8); ctx.lineWidth=1; ctx.beginPath();

    }

    ctx.strokeStyle=hexa(it.color,.85); ctx.lineWidth=1; roundRect(x+0.5,top+0.5,it.w-1,LBL_H-1,4); ctx.stroke();
    ctx.fillStyle=it.color; ctx.fillText(it.t,x+7,it.ry+0.5);

  }
  ctx.restore();
  if(dropped>0) growFor(dropped);
}
/* formasyon etiketi: şeridin ve diğer etiketlerin üstüne binmeyen ilk konum */
function drawPatLabels(p){
  if(!S.patLbl.length) return;
  ctx.save(); ctx.font="bold 11px sans-serif"; ctx.textBaseline="middle"; ctx.textAlign="left";
  const occ=S.drawn.filter(function(d){return d.kind.indexOf("lane")===0;}).map(function(d){return [d.x,d.y,d.w,d.h];});
  const lo=p.top+3, hi=p.top+p.h-3;
  for(const L of S.patLbl){
    const w=Math.min(ctx.measureText(L.text).width+12, S.plotW-8), h=LBL_H;
    const cx=clamp(L.x-w/2,4,S.plotW-w-4);
    // aday konumlar: noktanın üstü/altı, solu/sağı; şeridin solu; yakından uzağa sıralı
    let laneX=S.plotW; for(const q of occ) laneX=Math.min(laneX,q[0]);
    const xs=[cx, clamp(L.x-w-10,4,S.plotW-w-4), clamp(L.x+10,4,S.plotW-w-4), clamp(laneX-w-8,4,S.plotW-w-4)];
    const cands=[];
    for(const x of xs) for(let dy=16; dy<=Math.max(60,p.h); dy+=11){
      cands.push([x,L.y-dy]); cands.push([x,L.y+dy]); }
    for(const x of xs) if(Math.abs(x-cx)>w/2) cands.push([x,L.y]);   // noktanın üstüne binmeden yanına
    cands.sort(function(a,b){ return Math.hypot(a[0]-cx,(a[1]-L.y)*1.6)-Math.hypot(b[0]-cx,(b[1]-L.y)*1.6); });
    let best=null, bestO=Infinity;
    for(const c of cands){
      const x=c[0], yc=clamp(c[1],lo+h/2,hi-h/2), r=[x,yc-h/2,w,h];
      let o=0; for(const q of occ) o+=ovl(r,q);
      if(o<bestO-0.5){ bestO=o; best=r; } if(o===0) break;
    }
    if(!best) continue;
    occ.push(best);
    ctx.fillStyle=hexa(L.color,.94); roundRect(best[0],best[1],w,h,5); ctx.fill();
    ctx.fillStyle=inkOn(L.color); ctx.fillText(L.text,best[0]+6,best[1]+h/2+0.5);
    S.drawn.push({kind:"pattern",text:L.text,x:best[0],y:best[1],w:w,h:h,tw:ctx.measureText(L.text).width});
  }
  ctx.restore();
}
function ovl(a,b){
  const w=Math.min(a[0]+a[2],b[0]+b[2])-Math.max(a[0],b[0]), h=Math.min(a[1]+a[3],b[1]+b[3])-Math.max(a[1],b[1]);
  return (w>0&&h>0)?w*h:0;
}
/* şerit sığmazsa grafiği (izin verilen üst sınıra kadar) uzat */
function growFor(n){
  if(S.big||fsOn()||!S.args||!(S.args.hmax>0)) return;
  const want=Math.min(S.args.hmax, S.height+n*(LBL_H+LBL_GAP)+12);
  if(want>S.height+4){ S.grow+=want-S.height; S.height=want; setFrameHeight(S.height); setTimeout(resize,40); }
}

function drawPrice(p){
  const bars=series(), [i0,i1]=visRange(), w=bw();
  const bodyW=Math.max(1,Math.min(w*0.72,28));
  if(S.type==="line"||S.type==="area"){
    ctx.beginPath();
    for(let i=i0;i<=i1;i++){ const b=bars[i]; if(!b)continue; const x=X(i+.5), y=Y(p,b.c);
      i===i0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    if(S.type==="area"){
      const g=ctx.createLinearGradient(0,p.top,0,p.top+p.h);
      g.addColorStop(0,"rgba(91,140,255,.26)"); g.addColorStop(1,"rgba(91,140,255,0)");
      ctx.save(); ctx.lineTo(X(i1+.5),p.top+p.h); ctx.lineTo(X(i0+.5),p.top+p.h); ctx.closePath();
      ctx.fillStyle=g; ctx.fill(); ctx.restore();
      ctx.beginPath();
      for(let i=i0;i<=i1;i++){ const b=bars[i]; if(!b)continue; const x=X(i+.5), y=Y(p,b.c);
        i===i0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    }
    ctx.strokeStyle=ACC; ctx.lineWidth=1.6; ctx.lineJoin="round"; ctx.stroke(); return;
  }
  let vmax=1;
  if(S.type==="volcandles"){ for(let i=i0;i<=i1;i++){ const b=S.bars[i]; if(b&&b.v>vmax)vmax=b.v; } }
  for(let i=i0;i<=i1;i++){
    const b=bars[i]; if(!b)continue;
    const x=X(i+.5), up=b.c>=b.o, col=up?UP:DOWN;
    const yo=Y(p,b.o), yc=Y(p,b.c), yh=Y(p,b.h), yl=Y(p,b.l);
    ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=Math.max(1,Math.min(1.6,w*0.12));
    if(S.type==="bars"){
      ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5,yh); ctx.lineTo(Math.round(x)+0.5,yl);
      ctx.moveTo(x-bodyW/2,yo); ctx.lineTo(x,yo); ctx.moveTo(x,yc); ctx.lineTo(x+bodyW/2,yc);
      ctx.stroke(); continue;
    }
    let bwd=bodyW;
    if(S.type==="volcandles"){ const vb=S.bars[i];
      bwd=Math.max(1,bodyW*(0.22+0.78*Math.sqrt((vb?vb.v:0)/vmax))); }
    ctx.beginPath(); ctx.moveTo(Math.round(x)+0.5,yh); ctx.lineTo(Math.round(x)+0.5,yl); ctx.stroke();
    const top=Math.min(yo,yc), hgt=Math.max(1,Math.abs(yc-yo));

    else ctx.fillRect(x-bwd/2,top,bwd,hgt);
  }
}

function lineSeries(p,key,color,width,dash){

function bandFill(p,kUp,kLo,fill){

function drawZones(p){

    ctx.moveTo(x0,Math.round(top+h)-0.5); ctx.lineTo(S.plotW,Math.round(top+h)-0.5); ctx.stroke();

/* ---------------------------------------------------------------- v4.0 overlays (Short Term)
   v4.1: Order block'lar kendi renklerini kullanır (mor / pembe) ve taralı doldurulur; böylece
   destek-direnç bantları (yeşil / kırmızı) ve dikdörtgen formasyonu (camgöbeği) ile karışmaz. */
var OB_BULL="#A78BFA", OB_BEAR="#F472B6";
function ovOn(k){ return S.ov && (!S.ov.show || S.ov.show[k]!==false); }
var _hatch={};
function hatchFill(color,alpha){
  const k=color+"|"+alpha;
  if(_hatch[k]) return _hatch[k];
  const c=document.createElement("canvas"); c.width=8; c.height=8;
  const x=c.getContext("2d");
  x.fillStyle=hexa(color,alpha*0.4); x.fillRect(0,0,8,8);
  x.strokeStyle=hexa(color,Math.min(1,alpha*2.4)); x.lineWidth=1.5;
  x.beginPath(); x.moveTo(-2,10); x.lineTo(10,-2); x.moveTo(-2,2); x.lineTo(2,-2);
  x.moveTo(6,10); x.lineTo(10,6); x.stroke();
  const p=ctx.createPattern(c,"repeat"); _hatch[k]=p; return p;
}
function drawOB(p){
  if(!ovOn("obs")||!(S.ov.obs||[]).length) return;
  ctx.save(); ctx.font="bold 10px sans-serif"; ctx.textBaseline="middle";
  for(const o of S.ov.obs){
    const y1=Y(p,o.hi), y2=Y(p,o.lo);
    if(Math.max(y1,y2)<p.top||Math.min(y1,y2)>p.top+p.h) continue;
    const x0=X(o.start), x1=(o.end==null)?S.plotW:Math.min(S.plotW,X(o.end+1));
    if(x1<=0||x0>=S.plotW) continue;
    const xa=Math.max(0,x0), top=Math.min(y1,y2), h=Math.max(3,Math.abs(y2-y1));
    const base=o.kind==="bull"?OB_BULL:OB_BEAR, dead=o.end!=null;
    ctx.fillStyle=hatchFill(base,dead?.09:.22); ctx.fillRect(xa,top,x1-xa,h);
    ctx.strokeStyle=hexa(base,dead?.35:.95); ctx.lineWidth=dead?1:1.5;
    ctx.setLineDash(dead?[4,4]:[]);
    ctx.strokeRect(Math.round(xa)+0.5,Math.round(top)+0.5,Math.max(1,x1-xa-1),Math.max(1,h-1));
    ctx.setLineDash([]);
    if(!dead){ ctx.fillStyle=base; ctx.fillRect(Math.round(xa),top,3,h); }   /* sol kenarda kalın işaret */
    const vt=Math.max(top,p.top), vb=Math.min(top+h,p.top+p.h);
    if(!dead && o.label && vb>vt){        // v4.2: canlı OB etiketi sağ şeritte — her zaman tam görünür
      laneAdd((vt+vb)/2, o.label, base, 4,
        {kind:"ob", short:o.short||((o.kind==="bull"?"Bull OB":"Bear OB")+(o.vx?" "+o.vx:""))});
    } else if(dead && o.label){             // geçersiz OB: kutuya sığıyorsa içine, sığmıyorsa yazılmaz
      const sl=o.kind==="bull"?"Bull OB (filled)":"Bear OB (filled)", tw=ctx.measureText(sl).width;
      const ly=clamp(top+Math.min(h/2,9)+1, p.top+8, p.top+p.h-8);
      if(x1-xa>tw+16){ ctx.fillStyle=hexa(base,.75); ctx.textAlign="left"; ctx.fillText(sl,xa+8,ly); }
    }
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h); ctx.lineTo(x+r,y+h);
  ctx.quadraticCurveTo(x,y+h,x,y+h-r); ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

  if(!(S.cfg.legend&&S.cfg.legend.on)){ if(L.innerHTML) L.innerHTML=""; return; }
  const i=curIdx();
  const b=series()[i]; if(!b){ L.innerHTML=""; return; }
  const ch=b.c-b.o, chp=b.o?ch/b.o*100:0, col=ch>=0?UP:DOWN;
  const c=S.cfg;
  const ivr=(S.ivList||[]).filter(function(x){return x[0]===S.interval;})[0];
  let h='<div class="r"><span class="nm">'+esc(S.name)+'</span> <span style="color:#6B7383">'+
    esc(ivr?ivr[2]:S.interval)+' · '+TYPEL[S.type]+'</span></div>';
  h+='<div class="r v" style="color:'+col+'">O '+fmtP(b.o)+'  H '+fmtP(b.h)+'  L '+fmtP(b.l)+'  C '+fmtP(b.c)+
     '  <span>'+(ch>=0?"+":"−")+fmt(Math.abs(ch),S.dec)+" ("+pct(chp)+')</span></div>';
  if(c.sma&&c.sma.on){
    const parts=(c.sma.ps||[]).map(function(n,k){ const s=S.ind["sma"+n], v=s?s[i]:null;
      return '<span style="color:'+smaColor(n,k)+'">SMA'+n+" "+(v==null?"—":fmtP(v))+"</span>"; });
    h+='<div class="r v">'+parts.join("  ")+"</div>";
  }
  if(c.nw&&c.nw.on){ const u=S.ind.nw_up,l=S.ind.nw_lo;
    h+='<div class="r v" style="color:'+CC("nw","c","#C4B5FD")+'">Nadaraya-Watson '+
       (u&&u[i]!=null?fmtP(l[i])+" – "+fmtP(u[i]):"—")+"</div>"; }
  if(c.boll&&c.boll.on){ const u=S.ind.bb_up,l=S.ind.bb_lo;
    h+='<div class="r v" style="color:'+CC("boll","c","#9AA4B2")+'">Bollinger '+(c.boll.n||20)+", "+
       (c.boll.k||2)+"  "+(u&&u[i]!=null?fmtP(l[i])+" – "+fmtP(u[i]):"—")+"</div>"; }
  const dirLine=function(key,dk,lbl,ck){
    const s=S.ind[key]; if(!s) return "";
    const v=s[i], dr=S.ind[dk], up=dr&&dr[i]!=null?dr[i]>0:true;
    const col=up?CC(ck,"cu",UP):CC(ck,"cd",DOWN);
    return '<span style="color:'+col+'">'+lbl+" "+(v==null?"—":fmtP(v))+
           " "+(up?"▲":"▼")+"</span>";
  };
  const trendRow=[];
  if(c.sup&&c.sup.on) trendRow.push(dirLine("sup","sup_dir","Supertrend","sup"));
  if(c.vidya&&c.vidya.on) trendRow.push(dirLine("vid","vid_dir","VIDYA","vidya"));
  if(c.vstop&&c.vstop.on) trendRow.push(dirLine("vstop","vstop_dir","Vol. Stop","vstop"));
  if(trendRow.filter(Boolean).length) h+='<div class="r v">'+trendRow.filter(Boolean).join("  ")+"</div>";
  const extra=[];
  if(c.zones&&c.zones.on) extra.push("Ranked S/R · "+S.zones.length);
  if(c.gaps&&c.gaps.on) extra.push("Gaps · "+S.gaps.length);
  if(c.div&&c.div.on) extra.push("Divergence "+(c.div.src||"rsi").toUpperCase()+" · "+S.divs.length);
  if(extra.length) h+='<div class="r v" style="color:#6B7383">'+extra.join("  ·  ")+"</div>";
  L.innerHTML=h;
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

const TOOLS={
 trend:{n:2,name:"Trend Line"}, info:{n:2,name:"Info Line"}, extended:{n:2,name:"Extended Line"},
 ray:{n:2,name:"Trend Ray"}, angle:{n:2,name:"Trend Angle"}, hline:{n:1,name:"Horizontal Line"},
 hray:{n:1,name:"Horizontal Ray"}, vline:{n:1,name:"Vertical Line"},
 pchannel:{n:3,name:"Parallel Channel"}, regression:{n:2,name:"Regression Trend"},

 pricerange:{n:2,name:"Price Range"}, daterange:{n:2,name:"Date Range"},
 forecast:{n:3,name:"Forecast"}, long:{n:3,name:"Long Position"}, short:{n:3,name:"Short Position"},

 tri:{n:3,name:"Triangle"}, arc:{n:3,name:"Arc"}, curve:{n:3,name:"Curve"}
};
const FIBL=[0,0.236,0.382,0.5,0.618,0.786,1,1.618];
const DEFSTYLE={c:"#5B8CFF",w:1.6,dash:0};

function scrPts(d){
  const p=S.panes[0];
  return d.pts.map(function(q){ return {x:X(iOfT(q.t)+.5), y:Y(p,q.p), t:q.t, p:q.p}; });
}
function lineAt(a,b,x){ return a.y+(b.y-a.y)*((x-a.x)/((b.x-a.x)||1e-9)); }
function extendBoth(a,b){
  const dx=b.x-a.x, dy=b.y-a.y, P=S.panes[0];
  if(Math.abs(dx)<1e-6) return {a:{x:a.x,y:P.top},b:{x:a.x,y:P.top+P.h}};
  const k=dy/dx;
  return {a:{x:0,y:a.y+(0-a.x)*k}, b:{x:S.plotW,y:a.y+(S.plotW-a.x)*k}};
}
function barsBetween(d){ return Math.round(iOfT(d.pts[1].t)-iOfT(d.pts[0].t)); }
function daysBetween(d){ return Math.round((d.pts[1].t-d.pts[0].t)/86400000); }

/* her araç: ekran koordinatlarında geometri üretir (çizim + tıklama testi aynı yerden) */
function geom(d){
  const q=scrPts(d), g={lines:[],polys:[],rects:[],ells:[],arcs:[],texts:[],dots:[]};
  const c=(d.style&&d.style.c)||DEFSTYLE.c, w=(d.style&&d.style.w)||DEFSTYLE.w;
  const dash=(d.style&&d.style.dash)?[6,4]:null;
  const t=d.type;
  if(q.length<1) return g;
  const A=q[0], B=q[1], C=q[2];
  if((t==="trend"||t==="info"||t==="extended"||t==="ray"||t==="angle")&&!B) return g;
  if(t==="trend"||t==="info"){
    g.lines.push({a:A,b:B,color:c,w:w,dash:dash});
    if(t==="info"&&B){
      const dp=d.pts[1].p-d.pts[0].p, pp=d.pts[0].p?dp/d.pts[0].p*100:0;
      g.texts.push({x:(A.x+B.x)/2,y:(A.y+B.y)/2-12,s:(dp>=0?"+":"−")+fmt(Math.abs(dp),S.dec)+" ("+pct(pp)+")  "+
        barsBetween(d)+" bar",color:c,bg:true});
    }
  }
  else if(t==="extended"){ const e=extendBoth(A,B);
    g.lines.push({a:e.a,b:e.b,color:c,w:w,dash:dash}); g.dots.push({x:A.x,y:A.y},{x:B.x,y:B.y}); }
  else if(t==="ray"){ const e=extendBoth(A,B);
    g.lines.push({a:A,b:(B.x>=A.x?e.b:e.a),color:c,w:w,dash:dash}); }
  else if(t==="angle"){
    g.lines.push({a:A,b:B,color:c,w:w});
    g.lines.push({a:A,b:{x:B.x,y:A.y},color:"rgba(141,150,165,.7)",w:1,dash:[4,3]});
    const ang=Math.atan2(-(B.y-A.y),(B.x-A.x))*180/Math.PI;
    g.texts.push({x:B.x+6,y:A.y-10,s:fmt(ang,1)+"°",color:c,bg:true});
  }
  else if(t==="hline"){ g.lines.push({a:{x:0,y:A.y},b:{x:S.plotW,y:A.y},color:c,w:w,dash:dash});
    g.texts.push({x:S.plotW-4,y:A.y-10,s:fmtP(d.pts[0].p),color:c,align:"right",bg:true}); }
  else if(t==="hray"){ g.lines.push({a:A,b:{x:S.plotW,y:A.y},color:c,w:w,dash:dash});
    g.texts.push({x:S.plotW-4,y:A.y-10,s:fmtP(d.pts[0].p),color:c,align:"right",bg:true}); }
  else if(t==="vline"){ const P=S.panes[0];
    g.lines.push({a:{x:A.x,y:P.top},b:{x:A.x,y:P.top+P.h},color:c,w:w,dash:dash});
    g.texts.push({x:A.x+5,y:P.top+12,s:dtstr(d.pts[0].t),color:c,bg:true}); }
  else if(t==="pchannel"&&C){
    const off=C.y-lineAt(A,B,C.x);
    const e1=extendBoth(A,B);
    const e2={a:{x:e1.a.x,y:e1.a.y+off},b:{x:e1.b.x,y:e1.b.y+off}};
    g.polys.push({pts:[[e1.a.x,e1.a.y],[e1.b.x,e1.b.y],[e2.b.x,e2.b.y],[e2.a.x,e2.a.y]],
      fill:hexa(c,.08),color:null});
    g.lines.push({a:e1.a,b:e1.b,color:c,w:w},{a:e2.a,b:e2.b,color:c,w:w});
    const mid={a:{x:e1.a.x,y:e1.a.y+off/2},b:{x:e1.b.x,y:e1.b.y+off/2}};
    g.lines.push({a:mid.a,b:mid.b,color:hexa(c,.5),w:1,dash:[5,4]});
  }
  else if(t==="regression"&&B){
    const i0=Math.round(iOfT(d.pts[0].t)), i1=Math.round(iOfT(d.pts[1].t));
    const a=Math.max(0,Math.min(i0,i1)), b2=Math.min(S.bars.length-1,Math.max(i0,i1));
    let n=0,sx=0,sy=0,sxy=0,sxx=0;
    for(let i=a;i<=b2;i++){ const v=S.bars[i]; if(!v)continue;
      n++; sx+=i; sy+=v.c; sxy+=i*v.c; sxx+=i*i; }
    if(n>1){
      const den=(n*sxx-sx*sx)||1e-9, m=(n*sxy-sx*sy)/den, k=(sy-m*sx)/n;
      let se=0; for(let i=a;i<=b2;i++){ const v=S.bars[i]; if(!v)continue;
        const r=v.c-(m*i+k); se+=r*r; }
      const sd=Math.sqrt(se/Math.max(1,n-1));
      const P=S.panes[0];
      const p1={x:X(a+.5),y:Y(P,m*a+k)}, p2={x:X(b2+.5),y:Y(P,m*b2+k)};
      const u1={x:p1.x,y:Y(P,m*a+k+2*sd)}, u2={x:p2.x,y:Y(P,m*b2+k+2*sd)};
      const l1={x:p1.x,y:Y(P,m*a+k-2*sd)}, l2={x:p2.x,y:Y(P,m*b2+k-2*sd)};
      g.polys.push({pts:[[u1.x,u1.y],[u2.x,u2.y],[l2.x,l2.y],[l1.x,l1.y]],fill:hexa(c,.07)});
      g.lines.push({a:p1,b:p2,color:c,w:w},{a:u1,b:u2,color:hexa(c,.7),w:1,dash:[5,4]},
        {a:l1,b:l2,color:hexa(c,.7),w:1,dash:[5,4]});
      g.texts.push({x:p2.x+6,y:p2.y-10,s:(m>=0?"↗":"↘")+" "+fmt(m*(b2-a),S.dec),color:c,bg:true});
    }
  }
  else if(t==="flat"&&C){
    const P=S.panes[0], yFlat=A.y;
    const x0=Math.min(A.x,B.x), x1=Math.max(A.x,B.x);
    const slope={a:{x:x0,y:C.y},b:{x:x1,y:B.y}};
    g.polys.push({pts:[[x0,yFlat],[x1,yFlat],[slope.b.x,slope.b.y],[slope.a.x,slope.a.y]],fill:hexa(c,.08)});
    g.lines.push({a:{x:x0,y:yFlat},b:{x:x1,y:yFlat},color:c,w:w},{a:slope.a,b:slope.b,color:c,w:w});
  }
  else if(t==="pitchfork"&&C){
    const mid={x:(B.x+C.x)/2,y:(B.y+C.y)/2};
    const dx=mid.x-A.x, dy=mid.y-A.y, len=Math.hypot(dx,dy)||1;
    const k=Math.max(S.plotW,H)*2/len;
    const end={x:A.x+dx*k,y:A.y+dy*k};
    const eb={x:B.x+dx*k,y:B.y+dy*k}, ec={x:C.x+dx*k,y:C.y+dy*k};
    g.polys.push({pts:[[B.x,B.y],[eb.x,eb.y],[ec.x,ec.y],[C.x,C.y]],fill:hexa(c,.07)});
    g.lines.push({a:A,b:end,color:c,w:w+0.4},{a:B,b:eb,color:hexa(c,.85),w:w},
      {a:C,b:ec,color:hexa(c,.85),w:w},{a:B,b:C,color:hexa(c,.6),w:1,dash:[4,3]});
  }
  else if(t==="fib"&&B){
    const P=S.panes[0], p0=d.pts[0].p, p1=d.pts[1].p, dp=p1-p0;
    const x0=Math.min(A.x,B.x), x1=Math.max(A.x,B.x), xe=S.plotW;
    let prev=null;
    for(const L of FIBL){
      const pv=p1-dp*L, y=Y(P,pv);
      if(prev!=null) g.polys.push({pts:[[x0,prev],[xe,prev],[xe,y],[x0,y]],
        fill:hexa(FIBC(L),.05)});
      prev=y;
      g.lines.push({a:{x:x0,y:y},b:{x:xe,y:y},color:FIBC(L),w:L===0||L===1?1.5:1.1,
        dash:L===0.5?[5,4]:null});
      g.texts.push({x:x0+4,y:y-9,s:fmt(L,3).replace(",000","")+"  "+fmtP(pv),color:FIBC(L),bg:true,size:10});
    }
    g.lines.push({a:A,b:B,color:hexa(c,.5),w:1,dash:[4,4]});
  }
  else if(t==="elliott"){
    const pts=q.map(function(p){return [p.x,p.y];});
    g.polys.push({pts:pts,color:c,w:w});
    const labs=["0","1","2","3","4","5"];
    q.forEach(function(p,ix){ const up = ix>0 ? q[ix].y<q[ix-1].y : true;
      g.texts.push({x:p.x,y:p.y+(up?-13:14),s:labs[ix]||"",color:c,align:"center",bg:true,size:11}); });
  }
  else if(t==="triangle_pat"){
    g.polys.push({pts:q.map(function(p){return [p.x,p.y];}),color:c,w:w});
    if(q.length>=4){
      const e1=extendBoth(q[0],q[2]), e2=extendBoth(q[1],q[3]);
      g.lines.push({a:q[0],b:e1.b,color:hexa(c,.75),w:1.2,dash:[5,4]},
        {a:q[1],b:e2.b,color:hexa(c,.75),w:1.2,dash:[5,4]});
    }
    q.forEach(function(p,ix){ g.texts.push({x:p.x,y:p.y-13,s:String(ix+1),color:c,align:"center",size:10}); });
  }
  else if(t==="hns"){
    g.polys.push({pts:q.map(function(p){return [p.x,p.y];}),color:c,w:w});
    const L={1:"LS",3:"H",5:"RS"};
    q.forEach(function(p,ix){ if(L[ix]) g.texts.push({x:p.x,y:p.y-14,s:L[ix],color:c,align:"center",bg:true,size:10}); });
    if(q.length>=5){
      const e=extendBoth(q[2],q[4]);
      g.lines.push({a:e.a,b:e.b,color:WARN,w:1.4,dash:[6,4]});
      g.texts.push({x:e.b.x-6,y:e.b.y-10,s:"Neckline",color:WARN,align:"right",size:10,bg:true});
    }
  }
  else if(t==="pricerange"&&B){
    const x0=Math.min(A.x,B.x),x1=Math.max(A.x,B.x),y0=Math.min(A.y,B.y),y1=Math.max(A.y,B.y);
    const dp=d.pts[1].p-d.pts[0].p, up=dp>=0;
    g.rects.push({x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0),
      fill:up?"rgba(38,166,154,.055)":"rgba(239,83,80,.055)",
      color:up?hexa(UP,.75):hexa(DOWN,.75),lw:1.2,dash:[5,4]});
    g.texts.push({x:(x0+x1)/2,y:(y0+y1)/2,s:(dp>=0?"+":"−")+fmt(Math.abs(dp),S.dec)+
      "  ("+pct(d.pts[0].p?dp/d.pts[0].p*100:0)+")",color:up?UP:DOWN,align:"center",bg:true});
  }
  else if(t==="daterange"&&B){
    const x0=Math.min(A.x,B.x),x1=Math.max(A.x,B.x);
    const P=S.panes[0];
    g.rects.push({x:x0,y:P.top+6,w:Math.max(1,x1-x0),h:Math.max(1,P.h-12),
      fill:"rgba(91,140,255,.05)",color:hexa(ACC,.7),lw:1.2,dash:[5,4]});
    g.texts.push({x:(x0+x1)/2,y:P.top+18,s:Math.abs(barsBetween(d))+" bar · "+
      Math.abs(daysBetween(d))+" days",color:ACC,align:"center",bg:true});
  }
  else if(t==="forecast"&&C){
    g.lines.push({a:A,b:B,color:c,w:w});
    g.lines.push({a:B,b:C,color:c,w:w,dash:[6,4]});
    g.polys.push({pts:[[B.x,B.y],[C.x,C.y],[C.x,B.y]],fill:hexa(c,.045)});
    const dp=d.pts[2].p-d.pts[1].p;
    g.texts.push({x:C.x+6,y:C.y-10,s:(dp>=0?"▲":"▼")+" "+pct(d.pts[1].p?dp/d.pts[1].p*100:0)+
      " · "+Math.abs(Math.round(iOfT(d.pts[2].t)-iOfT(d.pts[1].t)))+" bar",color:dp>=0?UP:DOWN,bg:true});
  }
  else if((t==="long"||t==="short")&&C){
    const isL=t==="long";
    const P=S.panes[0];
    const entry=d.pts[0].p, target=d.pts[1].p, stop=d.pts[2].p;
    const x0=A.x, x1=Math.max(A.x+40,q[2].x);
    const ye=Y(P,entry), yt=Y(P,target), ys=Y(P,stop);
    g.rects.push({x:x0,y:Math.min(ye,yt),w:Math.max(1,x1-x0),h:Math.max(1,Math.abs(yt-ye)),
      fill:"rgba(38,166,154,.07)",color:"rgba(38,166,154,.55)",lw:1.1});
    g.rects.push({x:x0,y:Math.min(ye,ys),w:Math.max(1,x1-x0),h:Math.max(1,Math.abs(ys-ye)),
      fill:"rgba(239,83,80,.07)",color:"rgba(239,83,80,.55)",lw:1.1});
    g.lines.push({a:{x:x0,y:ye},b:{x:x1,y:ye},color:ACC,w:1.4});
    const risk=Math.abs(entry-stop), rew=Math.abs(target-entry);
    const rr=risk?rew/risk:0;
    const sgn=isL?1:-1;
    g.texts.push({x:x0+6,y:Math.min(ye,yt)+12,s:"Target "+fmtP(target)+"  "+
      pct(entry?sgn*(target-entry)/entry*100:0),color:UP,bg:true,size:10.5});
    g.texts.push({x:x0+6,y:Math.max(ye,ys)-12,s:"Stop "+fmtP(stop)+"  "+
      pct(entry?sgn*(stop-entry)/entry*100:0),color:DOWN,bg:true,size:10.5});
    g.texts.push({x:x1-6,y:ye-11,s:(isL?"LONG":"SHORT")+" · Entry "+fmtP(entry)+" · R/R 1:"+fmt(rr,2),
      color:ACC,align:"right",bg:true,size:10.5});
  }
  else if(t==="rect"&&B){
    const x0=Math.min(A.x,B.x),x1=Math.max(A.x,B.x),y0=Math.min(A.y,B.y),y1=Math.max(A.y,B.y);
    g.rects.push({x:x0,y:y0,w:Math.max(1,x1-x0),h:Math.max(1,y1-y0),fill:hexa(c,.10),color:c,lw:w});
  }
  else if(t==="ellipse"&&B){
    g.ells.push({cx:(A.x+B.x)/2,cy:(A.y+B.y)/2,rx:Math.abs(B.x-A.x)/2,ry:Math.abs(B.y-A.y)/2,
      fill:hexa(c,.10),color:c,w:w});
  }
  else if(t==="tri"&&C){
    g.polys.push({pts:[[A.x,A.y],[B.x,B.y],[C.x,C.y]],close:true,fill:hexa(c,.10),color:c,w:w});
  }
  else if(t==="curve"&&C){
    const pts=[];
    for(let s2=0;s2<=1.0001;s2+=0.05){
      const x=(1-s2)*(1-s2)*A.x+2*(1-s2)*s2*C.x+s2*s2*B.x;
      const y=(1-s2)*(1-s2)*A.y+2*(1-s2)*s2*C.y+s2*s2*B.y;
      pts.push([x,y]);
    }
    g.polys.push({pts:pts,color:c,w:w});
  }
  else if(t==="arc"&&C){
    const cc=circum(A,B,C);
    if(cc){
      let a0=Math.atan2(A.y-cc.y,A.x-cc.x), a1=Math.atan2(B.y-cc.y,B.x-cc.x),
          am=Math.atan2(C.y-cc.y,C.x-cc.x);
      const norm=function(x){ while(x<0)x+=Math.PI*2; while(x>=Math.PI*2)x-=Math.PI*2; return x; };
      a0=norm(a0);a1=norm(a1);am=norm(am);
      let ccw=false;
      const between=function(s2,e,m){ return s2<e ? (m>s2&&m<e) : (m>s2||m<e); };
      if(!between(a0,a1,am)) ccw=true;
      g.arcs.push({cx:cc.x,cy:cc.y,r:cc.r,a0:a0,a1:a1,ccw:ccw,color:c,w:w});
    } else g.polys.push({pts:[[A.x,A.y],[C.x,C.y],[B.x,B.y]],color:c,w:w});
  }
  else if(t==="brush"){
    g.polys.push({pts:q.map(function(p){return [p.x,p.y];}),color:c,w:w});
  }
  return g;
}
function FIBC(L){ return L===0?"#9AA4B2":L===1?"#9AA4B2":L===0.618?"#F5B544":L===0.5?"#26A69A":
  L===0.382?"#5B8CFF":L===1.618?"#EF5350":"#C4B5FD"; }
function hexa(hex,a){
  if(hex.indexOf("rgba")===0) return hex;
  const h=hex.replace("#",""); const n=parseInt(h.length===3?h.split("").map(function(x){return x+x;}).join(""):h,16);
  return "rgba("+((n>>16)&255)+","+((n>>8)&255)+","+(n&255)+","+a+")";
}
function circum(a,b,c){
  const d=2*(a.x*(b.y-c.y)+b.x*(c.y-a.y)+c.x*(a.y-b.y));
  if(Math.abs(d)<1e-6) return null;
  const ux=((a.x*a.x+a.y*a.y)*(b.y-c.y)+(b.x*b.x+b.y*b.y)*(c.y-a.y)+(c.x*c.x+c.y*c.y)*(a.y-b.y))/d;
  const uy=((a.x*a.x+a.y*a.y)*(c.x-b.x)+(b.x*b.x+b.y*b.y)*(a.x-c.x)+(c.x*c.x+c.y*c.y)*(b.x-a.x))/d;
  return {x:ux,y:uy,r:Math.hypot(a.x-ux,a.y-uy)};
}
function drawDrawings(){
  const all=S.draws.slice();
  if(S.pend&&S.pend.pts.length) all.push(S.pend);
  for(const d of all){
    const g=geom(d), sel=S.sel===d.id;
    ctx.save();
    for(const pl of g.polys){
      if(!pl.pts.length) continue;
      ctx.beginPath(); ctx.moveTo(pl.pts[0][0],pl.pts[0][1]);
      for(let i=1;i<pl.pts.length;i++) ctx.lineTo(pl.pts[i][0],pl.pts[i][1]);
      if(pl.close||pl.fill) { if(pl.close)ctx.closePath(); if(pl.fill){ctx.fillStyle=pl.fill;ctx.fill();} }
      if(pl.color!==null&&pl.color!==undefined||!pl.fill){
        ctx.strokeStyle=pl.color||(d.style&&d.style.c)||DEFSTYLE.c;
        ctx.lineWidth=pl.w||(d.style&&d.style.w)||DEFSTYLE.w;
        ctx.lineJoin="round"; ctx.lineCap="round";
        if(pl.color!==null) ctx.stroke();
      }
    }
    for(const r of g.rects){
      if(r.fill){ ctx.fillStyle=r.fill; ctx.fillRect(r.x,r.y,r.w,r.h); }
      if(r.color){ ctx.save(); ctx.setLineDash(r.dash||[]);
        ctx.strokeStyle=r.color; ctx.lineWidth=r.lw||1.2; ctx.strokeRect(r.x,r.y,r.w,r.h); ctx.restore(); }
    }
    for(const e of g.ells){
      ctx.beginPath(); ctx.ellipse(e.cx,e.cy,Math.max(1,e.rx),Math.max(1,e.ry),0,0,Math.PI*2);
      if(e.fill){ctx.fillStyle=e.fill;ctx.fill();}
      ctx.strokeStyle=e.color; ctx.lineWidth=e.w||1.5; ctx.stroke();
    }
    for(const a of g.arcs){
      ctx.beginPath(); ctx.arc(a.cx,a.cy,a.r,a.a0,a.a1,a.ccw);
      ctx.strokeStyle=a.color; ctx.lineWidth=a.w||1.5; ctx.stroke();
    }
    for(const l of g.lines){
      ctx.beginPath(); ctx.setLineDash(l.dash||[]);
      ctx.moveTo(l.a.x,l.a.y); ctx.lineTo(l.b.x,l.b.y);
      ctx.strokeStyle=l.color; ctx.lineWidth=l.w||1.5; ctx.lineCap="round"; ctx.stroke();
      ctx.setLineDash([]);
    }
    for(const tx of g.texts){
      ctx.font=(tx.size||11)+"px sans-serif"; ctx.textAlign=tx.align||"left"; ctx.textBaseline="middle";
      if(tx.bg){
        const m=ctx.measureText(tx.s).width, pad=4;
        let x=tx.x-(tx.align==="center"?m/2:tx.align==="right"?m:0);
        ctx.fillStyle="rgba(10,11,13,.58)";
        ctx.fillRect(x-pad,tx.y-8,m+pad*2,16);
      }
      ctx.fillStyle=tx.color||TXT; ctx.fillText(tx.s,tx.x,tx.y);
    }
    for(const dt of g.dots){ ctx.beginPath(); ctx.arc(dt.x,dt.y,2.5,0,7);
      ctx.fillStyle=dt.color||(d.style&&d.style.c)||DEFSTYLE.c; ctx.fill(); }
    if(sel){
      for(const p of scrPts(d)){
        ctx.beginPath(); ctx.arc(p.x,p.y,5,0,7);
        ctx.fillStyle="#ECEEF1"; ctx.fill();
        ctx.strokeStyle=ACC; ctx.lineWidth=2; ctx.stroke();
      }
    }
    ctx.restore();
  }
}
function hitDraw(x,y){
  for(let k=S.draws.length-1;k>=0;k--){
    const d=S.draws[k], g=geom(d), tol=7;
    for(const l of g.lines) if(near(x,y,l.a.x,l.a.y,l.b.x,l.b.y,tol)) return d;
    for(const pl of g.polys){
      for(let i=1;i<pl.pts.length;i++)
        if(near(x,y,pl.pts[i-1][0],pl.pts[i-1][1],pl.pts[i][0],pl.pts[i][1],tol)) return d;
      if(pl.close&&pl.pts.length>2&&near(x,y,pl.pts[pl.pts.length-1][0],pl.pts[pl.pts.length-1][1],
        pl.pts[0][0],pl.pts[0][1],tol)) return d;
    }
    for(const r of g.rects){
      if(x>=r.x-tol&&x<=r.x+r.w+tol&&y>=r.y-tol&&y<=r.y+r.h+tol){
        const inside = x>r.x+tol&&x<r.x+r.w-tol&&y>r.y+tol&&y<r.y+r.h-tol;
        if(!inside||r.fill) return d;
      }
    }
    for(const e of g.ells){
      const dx=(x-e.cx)/Math.max(1,e.rx), dy=(y-e.cy)/Math.max(1,e.ry), v=dx*dx+dy*dy;
      if(v<1.25&&v>0.6) return d;
      if(e.fill&&v<=1) return d;
    }
    for(const a of g.arcs) if(Math.abs(Math.hypot(x-a.cx,y-a.cy)-a.r)<tol) return d;
    for(const p of scrPts(d)) if(Math.hypot(x-p.x,y-p.y)<9) return d;
  }
  return null;
}
function hitHandle(d,x,y){
  const q=scrPts(d);
  for(let i=0;i<q.length;i++) if(Math.hypot(x-q[i].x,y-q[i].y)<9) return i;
  return -1;
}

/* ---------------------------------------------------------------- geçmiş */
function snapshot(){ return JSON.stringify(S.draws); }
function pushUndo(){ S.undo.push(snapshot()); if(S.undo.length>60)S.undo.shift(); S.redo=[]; }
function undo(){ if(!S.undo.length)return; S.redo.push(snapshot());
  S.draws=JSON.parse(S.undo.pop()).map(normDraw); S.sel=null; draw(); pushDraws(); }
function redo(){ if(!S.redo.length)return; S.undo.push(snapshot());
  S.draws=JSON.parse(S.redo.pop()).map(normDraw); S.sel=null; draw(); pushDraws(); }
function pushDraws(){ send("draws",{draws:S.draws}); }

/* ==================================================================================
   ETKİLEŞİM
   ================================================================================== */
let pointers=new Map(), pinch=null, lastTap=0, panStart=null, moved=false;
const wrap=document.getElementById("wrap");

function pos(e){
  const r=cv.getBoundingClientRect();
  return {x:e.clientX-r.left, y:e.clientY-r.top};
}
wrap.addEventListener("pointerdown",function(e){
  // #ctl içindeki butonlar: pointer capture tıklamayı yutmasın (click #wrap'a kayıyordu)
  if(e.target&&e.target.closest&&e.target.closest("#ctl")) return;
  pointers.set(e.pointerId,pos(e));
  try{ wrap.setPointerCapture(e.pointerId); }catch(err){}
  const p=pos(e);
  moved=false;
  if(pointers.size===2){
    const a=Array.from(pointers.values());
    pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y), span:S.view.b-S.view.a,
      mx:(a[0].x+a[1].x)/2, i:I((a[0].x+a[1].x)/2)};
    panStart=null; return;
  }
  if(p.x>S.plotW){ panStart={scale:true,y:p.y,min:S.panes[0].min,max:S.panes[0].max}; return; }
  // çizim modundaysa nokta ekle
  if(S.tool){ addPoint(p); return; }
  const hitH = S.sel ? hitHandle(S.draws.filter(function(d){return d.id===S.sel;})[0]||{pts:[]},p.x,p.y) : -1;
  if(hitH>=0){ pushUndo(); S.drag={kind:"handle",id:S.sel,idx:hitH}; return; }
  const d=hitDraw(p.x,p.y);
  if(d){ S.sel=d.id; pushUndo();
    S.drag={kind:"move",id:d.id,x:p.x,y:p.y,orig:JSON.parse(JSON.stringify(d.pts))};
    draw(); showStyleBar(d); return; }
  if(S.sel){ S.sel=null; hidePop(); }
  const P0=S.panes[0];
  panStart={x:p.x,y:p.y,a:S.view.a,b:S.view.b, price:paneAt(p.y).id==="price",
            min:P0.min, max:P0.max, vert:!!(S.yMan&&!S.yAuto)};
  draw();
});
wrap.addEventListener("pointermove",function(e){
  const p=pos(e);
  if(pointers.has(e.pointerId)) pointers.set(e.pointerId,p);
  if(pinch&&pointers.size===2){
    const a=Array.from(pointers.values());
    const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
    const f=clamp(pinch.d/Math.max(8,d),0.2,5);
    const span=clamp(pinch.span*f,4,Math.max(20,S.bars.length*3));
    const r=(pinch.i-S.view.a)/(S.view.b-S.view.a);
    S.view.a=pinch.i-span*r; S.view.b=S.view.a+span;
    clampView(); draw(); return;
  }
  if(p.x<=S.plotW&&p.y<H-TS){ S.cross={i:I(p.x)-.5,y:p.y,x:p.x}; } else S.cross=null;
  if(panStart&&panStart.scale){
    const dy=p.y-panStart.y, mid=(panStart.min+panStart.max)/2;
    const f=Math.pow(1.01,dy);
    const half=(panStart.max-panStart.min)/2*f;
    S.yAuto=false; S.yMan={min:mid-half,max:mid+half};
    draw(); return;
  }
  if(S.drag){
    moved=true;
    const d=S.draws.filter(function(x){return x.id===S.drag.id;})[0];
    if(d){
      const P=S.panes[0];
      if(S.drag.kind==="handle"){
        d.pts[S.drag.idx]={t:tOfI(I(p.x)-.5),p:PR(P,p.y)};
      } else {
        const di=I(p.x)-I(S.drag.x), dpY=PR(P,p.y)-PR(P,S.drag.y);
        d.pts=S.drag.orig.map(function(q){ return {t:tOfI(iOfT(q.t)+di), p:q.p+dpY}; });
      }
      draw();
    }
    return;
  }
  if(panStart){
    const dx=p.x-panStart.x, dy=p.y-panStart.y;
    if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
    const span=panStart.b-panStart.a, sh=dx/S.plotW*span;
    S.view.a=panStart.a-sh; S.view.b=panStart.b-sh;
    clampView();
    // dikey kaydırma: fiyat panelinde belirgin dikey sürükleme (ya da ölçek zaten elle ise)
    if(panStart.price&&!panStart.vert&&Math.abs(dy)>10&&Math.abs(dy)>Math.abs(dx)*0.5) panStart.vert=true;
    if(panStart.price&&panStart.vert){
      const P=S.panes[0];
      panY(dy/Math.max(20,P.h), {min:panStart.min,max:panStart.max}); return;
    }
  }
  if(S.pend&&S.pend.pts.length){
    const P=S.panes[0], py=clampPy(p.y);
    const prev=S.pend.pts.slice(0,S.pendFixed);
    S.pend.pts=prev.concat([{t:tOfI(I(p.x)-.5),p:PR(P,py)}]);
    if(S.pend.type==="brush"&&S.brushing){
      S.pend.pts=prev; S.pend.pts.push({t:tOfI(I(p.x)-.5),p:PR(P,py)}); S.pendFixed=S.pend.pts.length; }
  }
  draw();
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinch=null;
  if(S.drag){ S.drag=null; pushDraws(); }
  if(S.brushing){ S.brushing=false; commitPending(true); }
  panStart=null;
}
wrap.addEventListener("pointerup",endPointer);
wrap.addEventListener("pointercancel",endPointer);
wrap.addEventListener("pointerleave",function(e){ S.cross=null; draw(); });
wrap.addEventListener("wheel",function(e){
  e.preventDefault();
  const p=pos(e);
  const P=S.panes[0], ph=Math.max(20,P.h);
  if(e.ctrlKey){ zoomAt(p.x, e.deltaY>0?1.06:0.94); return; }   // trackpad pinch / Ctrl + tekerlek
  // Shift + tekerlek: fiyatı yukarı / aşağı kaydır (Chrome Shift'te deltaY'yi deltaX'e taşır)
  if(e.shiftKey){ const d=e.deltaY||e.deltaX; panY(-d/ph*0.5); return; }
  // trackpad iki parmak: yatay + dikey kaydırma (fare tekerleği yakınlaştırmaya devam eder)
  const now=Date.now();
  // Chrome/Safari'de trackpad olaylarında wheelDeltaY === -3·deltaY olur; fare tekerleğinde olmaz
  const wdy=e.wheelDeltaY;
  const tpNow = e.deltaMode===0 && (Math.abs(e.deltaX)>0.5 ||
      (wdy!==undefined&&wdy!==0 ? Math.abs(wdy+3*e.deltaY)<0.5 : Math.abs(e.deltaY)<30));
  if(tpNow) S.tpUntil=now+400;
  if(tpNow||(S.tpUntil&&now<S.tpUntil)){
    const span=S.view.b-S.view.a;
    if(Math.abs(e.deltaX)>0.1){ S.view.a+=e.deltaX/S.plotW*span; S.view.b+=e.deltaX/S.plotW*span; clampView(); }
    if(Math.abs(e.deltaY)>0.1&&Math.abs(e.deltaY)>Math.abs(e.deltaX)*0.5&&p.y<P.top+P.h){ panY(-e.deltaY/ph); return; }
    draw(); return;
  }
  if(Math.abs(e.deltaX)>Math.abs(e.deltaY)){
    const span=S.view.b-S.view.a;
    S.view.a+=e.deltaX/S.plotW*span; S.view.b+=e.deltaX/S.plotW*span; clampView(); draw(); return;
  }
  zoomAt(p.x, e.deltaY>0?1.12:0.89);
},{passive:false});
wrap.addEventListener("dblclick",function(e){
  const p=pos(e);
  if(p.x>S.plotW){ S.yAuto=true; S.yMan=null; draw(); return; }
  if(S.pend&&TOOLS[S.pend.type].n===-1){ commitPending(true); return; }
  // Shift / Alt ile çift tık: aynı noktadan uzaklaştır
  zoomAt(p.x, (e.shiftKey||e.altKey) ? 1.9 : 0.5);

// sağ tık: o noktadan uzaklaştır (tarayıcı menüsü açılmaz)
wrap.addEventListener("contextmenu",function(e){
  e.preventDefault();
  const p=pos(e);
  if(p.x<=S.plotW) zoomAt(p.x,1.6);

// tablet: tek parmak çift dokunuş yakınlaştırır, iki parmak çift dokunuş uzaklaştırır
wrap.addEventListener("touchend",function(e){
  const now=Date.now();
  if(now-lastTap<320&&!moved){
    const r=cv.getBoundingClientRect(), x=e.changedTouches[0].clientX-r.left;

window.addEventListener("keydown",function(e){
  if(e.target&&/input|select|textarea/i.test(e.target.tagName)) return;
  if(e.key==="Escape"){ cancelTool(); hidePop(); closeModal(); }
  else if(e.key==="Delete"||e.key==="Backspace"){
    if(S.sel){ pushUndo(); S.draws=S.draws.filter(function(d){return d.id!==S.sel;});
      S.sel=null; draw(); pushDraws(); } }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){ e.preventDefault(); undo(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="y"){ e.preventDefault(); redo(); }
  else if(e.key==="ArrowLeft"){ const s=(S.view.b-S.view.a)*0.1; S.view.a-=s;S.view.b-=s;clampView();draw(); }
  else if(e.key==="ArrowRight"){ const s=(S.view.b-S.view.a)*0.1; S.view.a+=s;S.view.b+=s;clampView();draw(); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); panY(0.1); }
  else if(e.key==="ArrowDown"){ e.preventDefault(); panY(-0.1); }
  else if(e.key==="+"||e.key==="="){ zoomAt(S.plotW/2,0.85); }
  else if(e.key==="-"){ zoomAt(S.plotW/2,1.18); }
  else if(e.key==="f"||e.key==="F"){ toggleFull(); }
});

/* ---------------------------------------------------------------- araç akışı */
function startTool(type){
  hidePop();            // stil çubuğu bir sonraki tıklamayı engellemesin
  S.tool=type; S.sel=null;
  S.pend={id:uid(),type:type,pts:[],style:Object.assign({},DEFSTYLE)};
  S.pendFixed=0;
  const n=TOOLS[type].n;
  showHint(TOOLS[type].name+" · "+(n===-1?"press and drag to draw":"pick "+n+" points")+" · Esc to cancel");
  renderTools(); draw();
}
function cancelTool(){ S.tool=null; S.pend=null; S.pendFixed=0; S.brushing=false;
  hideHint(); renderTools(); draw(); }
/* çizim noktaları fiyat panelinin dışına taşmasın (alt panele tıklayınca saçma fiyat çıkıyordu) */
function clampPy(y){
  const P=S.panes[0];
  return clamp(y,P.top+1,P.top+P.h-1);
}
function addPoint(p){
  const P=S.panes[0], t=TOOLS[S.tool], pt={t:tOfI(I(p.x)-.5),p:PR(P,clampPy(p.y))};
  if(t.n===-1){ S.brushing=true; S.pend.pts=[pt]; S.pendFixed=1; draw(); return; }
  S.pend.pts=S.pend.pts.slice(0,S.pendFixed);
  S.pend.pts.push(pt); S.pendFixed=S.pend.pts.length;
  if(S.pend.pts.length>=t.n) commitPending();
  else { showHint(t.name+" · "+(t.n-S.pend.pts.length)+" points left · Esc to cancel"); draw(); }
}
function commitPending(force){
  if(!S.pend) return;
  const t=TOOLS[S.pend.type];
  if(t.n===-1&&S.pend.pts.length<2&&!force){ return; }
  if(S.pend.pts.length<2&&t.n!==1){ cancelTool(); return; }
  pushUndo();
  const d=S.pend; S.pend=null; S.pendFixed=0;
  S.draws.push(d); S.sel=d.id; S.tool=null; S.brushing=false;
  hideHint(); renderTools(); draw(); pushDraws();
  showStyleBar(d);   // renk/kalınlık hemen seçilebilsin
}

const TYPEL={candles:"Candles",hollow:"Hollow candles",bars:"Bars",line:"Line",area:"Area",
  heikin:"Heikin Ashi",volcandles:"Volume candles"};

function renderTools(){
  const box=document.getElementById("tools"); box.innerHTML="";
  GROUPS.forEach(function(g,gi){
    const b=el("button","tl"+(g.tools.length?" has":"")+
      ((S.tool&&g.tools.indexOf(S.tool)>=0)||(g.id==="cursor"&&!S.tool)?" on":""));
    b.title=g.name;
    b.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
      'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="'+g.icon+'"/></svg>';
    b.onclick=function(ev){
      if(g.id==="cursor"){ cancelTool(); return; }
      openToolMenu(g,b);
      ev.stopPropagation();
    };
    box.appendChild(b);
    if(g.id==="fib"||g.id==="proj") box.appendChild(el("div","tsep"));
  });
  const del=el("button","tl"); del.title="Delete all drawings";
  del.innerHTML='<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" '+
    'stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg>';
  del.onclick=function(){ if(!S.draws.length)return;
    pushUndo(); S.draws=[]; S.sel=null; draw(); pushDraws(); toast("Drawings deleted"); };
  box.appendChild(el("div","tsep")); box.appendChild(del);
}
function openToolMenu(g,anchor){
  const p=document.getElementById("pop"); p.innerHTML="";
  if(g.head) p.appendChild(el("div","h",g.head));
  if(g.sub&&g.sub!==g.head) p.appendChild(el("div","h",g.sub));

    const it=el("div","it"+(S.tool===tk?" on":""));
    it.innerHTML='<span class="ic">'+(S.tool===tk?"●":"◇")+"</span>"+esc(TOOLS[tk].name);
    it.onclick=function(){ hidePop(); startTool(tk); };

  });
  showPop(p,anchor,"right");
}
function showPop(p,anchor,side){
  markPop();
  p.classList.remove("style");
  p.classList.add("show");
  const r=anchor.getBoundingClientRect();
  p.style.visibility="hidden";
  requestAnimationFrame(function(){
    const pr=p.getBoundingClientRect();
    let left = side==="right" ? r.right+6 : r.left;
    let top = side==="right" ? r.top : r.bottom+6;
    left=Math.min(left, window.innerWidth-pr.width-8);
    top=Math.min(top, Math.max(8,window.innerHeight-pr.height-8));
    p.style.left=Math.max(6,left)+"px"; p.style.top=Math.max(6,top)+"px";
    p.style.visibility="visible";
  });
}

/* tam ekran: önce tarayıcının tam ekran API'si, izin yoksa paneli ekran boyuna büyüt */
function fsOn(){ return !!(document.fullscreenElement||document.webkitFullscreenElement); }
function toggleFull(){
  const el0=document.documentElement;
  if(fsOn()){
    (document.exitFullscreen||document.webkitExitFullscreen||function(){}).call(document);
    return;
  }
  const req=el0.requestFullscreen||el0.webkitRequestFullscreen;
  if(req){
    try{
      const r=req.call(el0);
      if(r&&r.catch) r.catch(function(){ fullFallback(); });
      return;
    }catch(err){}
  }
  fullFallback();
}
function fullFallback(){
  if(!S.big){ S.big=true; setFrameHeight(bigH()); setTimeout(resize,60); syncTop();
    toast("The browser blocked fullscreen — panel enlarged instead"); }
}

  const grid=el("div","swgrid");
  PALETTE.forEach(function(col){
    const b=el("button","swt"+(col.toLowerCase()===String(cur).toLowerCase()?" on":""));
    b.style.background=col; b.title=col;
    b.onclick=function(){ d.style.c=col; draw(); pushDraws(); showStyleBar(d); };
    grid.appendChild(b);
  });
  p.appendChild(grid);
  const row=el("div","it"); row.style.cursor="default";
  row.innerHTML='<span class="ic">🎨</span><input type="color" value="'+esc(cur)+'" id="stC" title="Custom colour">'+
    '<select id="stW" style="width:68px"><option value="1">thin</option>'+
    '<option value="1.6">medium</option><option value="2.6">thick</option></select>'+
    '<select id="stD" style="width:80px"><option value="0">solid</option><option value="1">dashed</option></select>';
  p.appendChild(row);
  const front=el("div","it"); front.innerHTML='<span class="ic">⬆</span>Bring to front';
  front.onclick=function(){ pushUndo(); S.draws=S.draws.filter(function(x){return x.id!==d.id;});
    S.draws.push(d); draw(); pushDraws(); };
  p.appendChild(front);
  const dup=el("div","it"); dup.innerHTML='<span class="ic">⧉</span>Duplicate';
  dup.onclick=function(){ pushUndo();
    const n=JSON.parse(JSON.stringify(d)); n.id=uid();
    const sh=(S.view.b-S.view.a)*0.04;
    n.pts=n.pts.map(function(q){ return {t:tOfI(iOfT(q.t)+sh),p:q.p}; });
    S.draws.push(n); S.sel=n.id; draw(); pushDraws(); showStyleBar(n); };
  p.appendChild(dup);
  const del=el("div","it"); del.innerHTML='<span class="ic">🗑</span>Delete';
  del.onclick=function(){ pushUndo(); S.draws=S.draws.filter(function(x){return x.id!==d.id;});
    S.sel=null; hidePop(); draw(); pushDraws(); };
  p.appendChild(del);
  // çizimin yanına yerleştir, ekran dışına taşma
  const r=document.getElementById("wrap").getBoundingClientRect();
  markPop();
  p.classList.add("show"); p.style.visibility="hidden";
  requestAnimationFrame(function(){
    const q=scrPts(d);
    let ax=r.left+12, ay=r.top+44;
    if(q.length){
      const xs=q.map(function(z){return z.x;}), ys=q.map(function(z){return z.y;});
      ax=r.left+Math.max.apply(null,xs)+14;
      ay=r.top+Math.min.apply(null,ys);
    }
    const pr=p.getBoundingClientRect();
    if(ax+pr.width>window.innerWidth-8) ax=Math.max(8,r.left+Math.min.apply(null,
      (q.length?q.map(function(z){return z.x;}):[0]))-pr.width-14);
    ay=Math.min(ay,Math.max(8,window.innerHeight-pr.height-8));
    p.style.left=Math.max(6,ax)+"px"; p.style.top=Math.max(6,ay)+"px";
    p.style.visibility="visible";
  });
  const c=document.getElementById("stC"), w=document.getElementById("stW"), ds=document.getElementById("stD");
  w.value=String(d.style.w||1.6); ds.value=String(d.style.dash?1:0);
  c.oninput=function(){ d.style.c=c.value; draw(); };
  c.onchange=function(){ pushDraws(); showStyleBar(d); };
  w.onchange=function(){ d.style.w=parseFloat(w.value); draw(); pushDraws(); };
  ds.onchange=function(){ d.style.dash=parseInt(ds.value,10); draw(); pushDraws(); };
}

/* ---------------------------------------------------------------- başlat */
new ResizeObserver(function(){ resize(); }).observe(document.getElementById("wrap"));
window.addEventListener("resize",resize);
renderTools();
if(inStreamlit){ stSend("streamlit:componentReady",{apiVersion:1}); }
else if(window.__PULSE_ARGS__){ applyArgs(window.__PULSE_ARGS__); }
window.PULSE={S:S,applyArgs:applyArgs,draw:draw,startTool:startTool,geom:geom,
  fitAll:fitAll,zoomAt:zoomAt,hitDraw:hitDraw,commitPending:commitPending,
  colors:function(){return {obBull:OB_BULL,obBear:OB_BEAR,up:UP,down:DOWN};},
  spreadY:spreadY,fitHeight:fitHeight,fitView:function(){fitView();draw();},priceH:priceH,drawn:function(){return S.drawn;},
  box:function(){return {W:W,H:H,plotW:S.plotW,ps:S.ps,price:S.panes[0]};}};
</script>
